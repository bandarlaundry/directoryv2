<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memuat Detail Usaha... — Laundry Directory V2.0</title>
  <meta id="meta-desc" name="description" content="Detail usaha laundry dan jasa kebersihan.">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root { --primary: #0284c7; --bg: #f8fafc; --text: #0f172a; --border: #e2e8f0; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; }
    header { background: white; padding: 1rem; border-bottom: 1px solid var(--border); }
    header h1 a { color: var(--primary); text-decoration: none; font-size: 1.2rem; }
    .container { max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
    .card { background: white; padding: 1.5rem; border-radius: 8px; border: 1px solid var(--border); display: flex; flex-direction: column; gap: 1rem; }
    .badge { background: #e0f2fe; color: #0369a1; padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; width: fit-content; }
    .actions { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.5rem; margin-top: 1rem; }
    .btn { padding: 0.7rem; border-radius: 6px; border: none; text-align: center; text-decoration: none; font-weight: 600; font-size: 0.85rem; }
    .btn-wa { background: #16a34a; color: white; }
    .btn-sec { background: #e2e8f0; color: var(--text); }
    .btn-pri { background: var(--primary); color: white; }
    #detail-map { height: 260px; width: 100%; border-radius: 8px; border: 1px solid var(--border); }
  </style>
  <script id="json-ld" type="application/ld+json"></script>
</head>
<body>

  <header>
    <h1><a href="/directoryv2/">← Laundry Directory V2.0</a></h1>
  </header>

  <main class="container">
    <article class="card" id="content">
      <div style="text-align: center; padding: 2rem; color: #64748b;">Memuat informasi usaha...</div>
    </article>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAY2JOM_GK_c8MIKOOROjG61XtC-VxF3Gc",
      authDomain: "laundry-directory-1915d.firebaseapp.com",
      projectId: "laundry-directory-1915d",
      storageBucket: "laundry-directory-1915d.appspot.com",
      messagingSenderId: "336437234560",
      appId: "1:336437234560:web:69dc7cbb36704c9f614f65"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    document.addEventListener("DOMContentLoaded", async () => {
      const parts = window.location.pathname.split('/').filter(Boolean);
      const slug = parts[parts.length - 1];

      if (!slug || slug === 'directoryv2' || slug === '404.html') {
        showError("URL tidak valid.");
        return;
      }

      try {
        const q = query(collection(db, "businesses"), where("slug", "==", slug));
        const snap = await getDocs(q);
        
        if (snap.empty) {
          showError("Usaha tidak ditemukan.");
          return;
        }

        const b = snap.docs[0].data();
        renderDetail(b);
      } catch (err) {
        showError("Gagal memuat data dari database.");
      }
    });

    function renderDetail(b) {
      let waNum = b.whatsapp ? b.whatsapp.replace(/[^0-9]/g, '') : '';
      if (waNum.startsWith('0')) waNum = '62' + waNum.slice(1);
      const waUrl = waNum ? `https://wa.me/${waNum}?text=${encodeURIComponent("Halo, saya menemukan usaha Anda via Laundry Directory.")}` : '#';
      const mapsUrl = `https://www.google.com/maps/dir/?api=1&destination=${b.latitude},${b.longitude}`;

      document.getElementById("content").innerHTML = `
        <span class="badge">${b.category}</span>
        <h1 style="color:var(--primary);">${b.name} ${b.city || ''}</h1>
        <p style="color:#475569;">${b.description || 'Layanan profesional, cepat, dan terpercaya.'}</p>
        <hr style="border:0; border-top:1px solid var(--border);">
        <div style="font-size:0.9rem; display:flex; flex-direction:column; gap:6px;">
          <div><strong>📍 Alamat:</strong> ${b.address}, ${b.city}</div>
          <div><strong>🕒 Jam Operasional:</strong> ${b.openingHours || '-'}</div>
          <div><strong>📞 WhatsApp:</strong> ${b.whatsapp || '-'}</div>
        </div>
        <div class="actions">
          <a href="${waUrl}" target="_blank" class="btn btn-wa">💬 WhatsApp</a>
          <a href="tel:${b.phone || b.whatsapp || ''}" class="btn btn-sec">📞 Telepon</a>
          <a href="${mapsUrl}" target="_blank" class="btn btn-pri">🧭 Petunjuk Arah</a>
        </div>
        <h3 style="margin-top:1rem;">Lokasi Peta</h3>
        <div id="detail-map"></div>
      `;

      // SEO Metadata
      document.title = `${b.name} ${b.city} — ${b.category} | Laundry Directory V2.0`;
      document.getElementById("meta-desc").setAttribute("content", `${b.name} melayani ${b.category} di ${b.city}. Lihat nomor WhatsApp, alamat, dan peta.`);

      // Schema.org LocalBusiness
      document.getElementById("json-ld").textContent = JSON.stringify({
        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "name": b.name,
        "telephone": b.whatsapp,
        "address": { "@type": "PostalAddress", "streetAddress": b.address, "addressLocality": b.city },
        "geo": { "@type": "GeoCoordinates", "latitude": b.latitude, "longitude": b.longitude }
      });

      // Render Leaflet Map
      if (b.latitude && b.longitude) {
        const map = L.map('detail-map').setView([b.latitude, b.longitude], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        L.marker([b.latitude, b.longitude]).addTo(map).bindPopup(b.name).openPopup();
      }
    }

    function showError(msg) {
      document.getElementById("content").innerHTML = `<h2>Usaha Tidak Ditemukan</h2><p>${msg}</p><a href="/directoryv2/" class="btn btn-pri" style="width:fit-content; margin-top:1rem;">Kembali ke Utama</a>`;
    }
  </script>
</body>
</html>
