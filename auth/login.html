<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Laundry Directory V2.0</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <h1><a href="../index.html">Laundry Directory V2.0</a></h1>
      <p>Masuk ke Portal Pengelola</p>
    </div>
  </header>

  <main style="max-width: 420px; margin: 3rem auto; padding: 0 1rem; width: 100%;">
    <div class="detail-card">
      <h2 style="font-size:1.3rem; color:var(--primary);">Login Pengguna</h2>
      <form id="login-form">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%; margin-top:0.5rem;">Login</button>
      </form>

      <div style="display:flex; justify-content:space-between; margin-top:1rem; font-size:0.85rem;">
        <a href="#" id="forgot-password" style="color:var(--text-muted);">Lupa Password?</a>
        <a href="register.html" style="color:var(--primary);">Daftar Akun Baru</a>
      </div>
    </div>
  </main>

  <script type="module">
    import { loginUser, resetPassword } from '../js/auth.js';

    document.getElementById("login-form").onsubmit = async (e) => {
      e.preventDefault();
      try {
        const { role } = await loginUser(
          document.getElementById("email").value,
          document.getElementById("password").value
        );
        if (role === 'admin') {
          window.location.href = '../dashboard/admin.html';
        } else {
          window.location.href = '../dashboard/owner.html';
        }
      } catch (err) {
        alert("Login gagal: " + err.message);
      }
    };

    document.getElementById("forgot-password").onclick = async (e) => {
      e.preventDefault();
      const email = prompt("Masukkan email Anda untuk instruksi reset password:");
      if (email) {
        try {
          await resetPassword(email);
          alert("Email reset password telah dikirim!");
        } catch (err) {
          alert("Error: " + err.message);
        }
      }
    };
  </script>
</body>
</html>
