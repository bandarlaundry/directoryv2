<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pendaftaran Pemilik Usaha — Laundry Directory V2.0</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <h1><a href="../index.html">Laundry Directory V2.0</a></h1>
      <p>Registrasi Akun Pemilik Usaha</p>
    </div>
  </header>

  <main style="max-width: 420px; margin: 3rem auto; padding: 0 1rem; width: 100%;">
    <div class="detail-card">
      <h2 style="font-size:1.3rem; color:var(--primary);">Daftar Sebagai Owner</h2>
      <form id="register-form">
        <div class="form-group">
          <label>Nama Lengkap</label>
          <input type="text" id="name" required placeholder="Sesuai KTP">
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" required placeholder="owner@laundry.com">
        </div>
        <div class="form-group">
          <label>Nomor WhatsApp</label>
          <input type="text" id="phone" required placeholder="085712345678">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" required minlength="6">
        </div>
        <div class="form-group">
          <label>Konfirmasi Password</label>
          <input type="password" id="confirmPassword" required minlength="6">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%; margin-top:0.5rem;">Daftar Sekarang</button>
      </form>
      <p style="font-size:0.85rem; text-align:center; margin-top:1rem; color:var(--text-muted);">
        Sudah memiliki akun? <a href="login.html" style="color:var(--primary);">Login di sini</a>
      </p>
    </div>
  </main>

  <script type="module">
    import { registerOwner } from '../js/auth.js';

    document.getElementById("register-form").onsubmit = async (e) => {
      e.preventDefault();
      const pwd = document.getElementById("password").value;
      const confirmPwd = document.getElementById("confirmPassword").value;

      if (pwd !== confirmPwd) {
        alert("Konfirmasi password tidak cocok!");
        return;
      }

      try {
        await registerOwner(
          document.getElementById("name").value,
          document.getElementById("email").value,
          document.getElementById("phone").value,
          pwd
        );
        window.location.href = '../dashboard/owner.html';
      } catch (err) {
        alert("Gagal registrasi: " + err.message);
      }
    };
  </script>
</body>
</html>
