<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login & Registrasi Owner — Laundry Directory V2.0</title>
  <style>
    :root { --primary: #0284c7; --bg: #f8fafc; --text: #0f172a; --border: #e2e8f0; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
    header { background: white; padding: 1rem; border-bottom: 1px solid var(--border); }
    header h1 a { color: var(--primary); text-decoration: none; font-size: 1.2rem; }
    
    .auth-card { max-width: 420px; margin: 2rem auto; background: white; padding: 1.5rem; border-radius: 8px; border: 1px solid var(--border); width: 90%; }
    .tabs { display: flex; gap: 0.5rem; margin-bottom: 1rem; border-bottom: 1px solid var(--border); }
    .tab-btn { flex: 1; padding: 0.6rem; border: none; background: none; cursor: pointer; font-weight: 600; color: #64748b; }
    .tab-btn.active { color: var(--primary); border-bottom: 2px solid var(--primary); }
    
    .form-group { display: flex; flex-direction: column; gap: 0.3rem; margin-bottom: 0.8rem; }
    .form-group input { padding: 0.6rem; border: 1px solid var(--border); border-radius: 6px; }
    .btn { padding: 0.7rem; border: none; border-radius: 6px; background: var(--primary); color: white; font-weight: 600; cursor: pointer; width: 100%; margin-top: 0.5rem; }
    .captcha-box { background: #f1f5f9; padding: 0.6rem; border-radius: 6px; border: 1px dashed #cbd5e1; margin-bottom: 0.8rem; font-size: 0.9rem; }
  </style>
</head>
<body>

  <header>
    <h1><a href="./">← Kembali ke Laundry Directory V2.0</a></h1>
  </header>

  <main class="auth-card">
    <div class="tabs">
      <button class="tab-btn active" id="tab-login">Login</button>
      <button class="tab-btn" id="tab-register">Registrasi Owner</button>
    </div>

    <!-- FORM LOGIN -->
    <form id="login-form">
      <div class="form-group"><label>Email</label><input type="email" id="login-email" required></div>
      <div class="form-group"><label>Password</label><input type="password" id="login-password" required></div>
      <button type="submit" class="btn">Masuk (Login)</button>
    </form>

    <!-- FORM REGISTRASI WITH CAPTCHA -->
    <form id="register-form" style="display: none;">
      <div class="form-group"><label>Nama Lengkap Owner</label><input type="text" id="reg-name" required></div>
      <div class="form-group"><label>Email</label><input type="email" id="reg-email" required></div>
      <div class="form-group"><label>Nomor WhatsApp</label><input type="text" id="reg-phone" required placeholder="085712345678"></div>
      <div class="form-group"><label>Password</label><input type="password" id="reg-password" required minlength="6"></div>
      
      <!-- CAPTCHA ARITMATIKA -->
      <div class="captcha-box">
        <label id="captcha-label" style="font-weight: bold; color: var(--primary);"></label>
        <input type="number" id="captcha-answer" placeholder="Jawaban angka" required style="margin-top:0.4rem; width:100%; padding:0.5rem; border:1px solid var(--border); border-radius:4px;">
      </div>

      <button type="submit" class="btn">Daftar Akun Owner</button>
    </form>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAY2JOM_GK_c8MIKOOROjG61XtC-VxF3Gc",
      authDomain: "laundry-directory-1915d.firebaseapp.com",
      projectId: "laundry-directory-1915d",
      storageBucket: "laundry-directory-1915d.appspot.com",
      messagingSenderId: "336437234560",
      appId: "1:336437234560:web:69dc7cbb36704c9f614f65"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // Dynamic Captcha State
    let num1 = 0, num2 = 0, captchaResult = 0;

    function generateCaptcha() {
      num1 = Math.floor(Math.random() * 10) + 1;
      num2 = Math.floor(Math.random() * 10) + 1;
      const isAddition = Math.random() > 0.5;

      if (isAddition) {
        captchaResult = num1 + num2;
        document.getElementById("captcha-label").innerText = `Verifikasi Keamanan: ${num1} + ${num2} = ?`;
      } else {
        if (num1 < num2) [num1, num2] = [num2, num1]; // Pastikan tidak minus
        captchaResult = num1 - num2;
        document.getElementById("captcha-label").innerText = `Verifikasi Keamanan: ${num1} - ${num2} = ?`;
      }
    }

    // Tab Switcher
    const tabLogin = document.getElementById("tab-login");
    const tabRegister = document.getElementById("tab-register");
    const formLogin = document.getElementById("login-form");
    const formRegister = document.getElementById("register-form");

    tabLogin.onclick = () => {
      tabLogin.classList.add("active"); tabRegister.classList.remove("active");
      formLogin.style.display = "block"; formRegister.style.display = "none";
    };
    tabRegister.onclick = () => {
      tabRegister.classList.add("active"); tabLogin.classList.remove("active");
      formRegister.style.display = "block"; formLogin.style.display = "none";
      generateCaptcha();
    };

    // Handler Login (Terperbaiki dari Error userData is not defined)
formLogin.onsubmit = async (e) => {
  e.preventDefault();
  try {
    const email = document.getElementById("login-email").value.trim();
    const pwd = document.getElementById("login-password").value;

    // 1. Authenticate dengan Firebase Auth
    const cred = await signInWithEmailAndPassword(auth, email, pwd);
    
    // 2. Ambil dokumen user dari Firestore
    const userDoc = await getDoc(doc(db, "users", cred.user.uid));
    let userData = null;

    if (userDoc.exists()) {
      userData = userDoc.data();
    } else {
      // PERLINDUNGAN: Jika dokumen di Firestore terhapus, buat ulang dokumen dasar secara otomatis
      const isAdmin = cred.user.email === "bandardeterjen@gmail.com";
      userData = {
        uid: cred.user.uid,
        email: cred.user.email,
        name: isAdmin ? "Super Admin" : "Owner",
        role: isAdmin ? "admin" : "owner",
        status: "approved"
      };
      // Simpan kembali dokumen user yang hilang
      await setDoc(doc(db, "users", cred.user.uid), userData);
    }

    // 3. Cek Status Approval (Kecuali Admin)
    if (userData.role !== 'admin' && userData.status !== 'approved') {
      await signOut(auth); // Keluarkan paksa
      alert("⚠️ Akun Anda masih menunggu persetujuan (approval) dari Admin.");
      return;
    }

    alert("Login Berhasil!");
    
    // 4. Pengalihan Halaman Berdasarkan Role
    if (userData.role === 'admin') {
      window.location.href = "./admin.html";
    } else {
      window.location.href = "./index.html";
    }

  } catch (err) { 
    alert("Gagal Login: " + err.message); 
  }
};

    // Handler Register
    formRegister.onsubmit = async (e) => {
      e.preventDefault();
      const userAnswer = parseInt(document.getElementById("captcha-answer").value);

      if (userAnswer !== captchaResult) {
        alert("Jawaban captcha salah! Silakan coba lagi.");
        generateCaptcha();
        document.getElementById("captcha-answer").value = "";
        return;
      }

      try {
        const email = document.getElementById("reg-email").value.trim();
        const pwd = document.getElementById("reg-password").value;
        const cred = await createUserWithEmailAndPassword(auth, email, pwd);

        // Status awal User Registrasi Otomatis = 'pending'
        await setDoc(doc(db, "users", cred.user.uid), {
          uid: cred.user.uid,
          name: document.getElementById("reg-name").value,
          email: email,
          phone: document.getElementById("reg-phone").value,
          role: "owner",
          status: "pending", 
          createdAt: serverTimestamp()
        });

        await signOut(auth); // Keluarkan agar tidak langsung masuk sebelum di-approve
        alert("Registrasi Berhasil! Akun Anda telah terdaftar dan sedang menunggu konfirmasi/approval Admin.");
        window.location.href = "./auth.html";
      } catch (err) { 
        alert("Gagal Registrasi: " + err.message); 
        generateCaptcha();
      }
    };

    generateCaptcha();
  </script>
</body>
</html>
