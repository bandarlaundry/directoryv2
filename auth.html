<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login & Registrasi Owner — Laundry Directory V2.0</title>
  <style>
    :root {
      --header-bg: #1e3a8a;
      --header-text: #ffffff;
      --footer-bg: #f97316;
      --footer-text: #000000;
      --bg: #ffffff;
      --surface: #ffffff;
      --text: #000000;
      --border: #e5e7eb;
      --primary: #0284c7;
    }
    body.dark-mode {
      --header-bg: #0f172a;
      --footer-bg: #c2410c;
      --footer-text: #ffffff;
      --bg: #0f172a;
      --surface: #1e293b;
      --text: #f8fafc;
      --border: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }

    header { background: var(--header-bg); color: var(--header-text); padding: 1rem 1.5rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); flex-wrap: wrap; gap: 0.5rem; }
    header h1 a { color: var(--header-text); text-decoration: none; font-size: 1.25rem; font-weight: 700; }
    
    .btn { padding: 0.5rem 0.9rem; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.85rem; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; }
    .btn-primary { background: var(--primary); color: white; }
    .btn-dark { background: rgba(255,255,255,0.2); color: white; border: 1px solid rgba(255,255,255,0.3); }

    .auth-card { max-width: 420px; margin: 2rem auto; background: var(--surface); padding: 1.5rem; border-radius: 8px; border: 1px solid var(--border); width: 90%; flex: 1; }
    .tabs { display: flex; gap: 0.5rem; margin-bottom: 1rem; border-bottom: 1px solid var(--border); }
    .tab-btn { flex: 1; padding: 0.6rem; border: none; background: none; cursor: pointer; font-weight: 600; color: #64748b; }
    .tab-btn.active { color: var(--primary); border-bottom: 2px solid var(--primary); }
    
    .form-group { display: flex; flex-direction: column; gap: 0.3rem; margin-bottom: 0.8rem; }
    .form-group input { padding: 0.6rem; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); }
    .captcha-box { background: rgba(0,0,0,0.03); padding: 0.6rem; border-radius: 6px; border: 1px dashed var(--border); margin-bottom: 0.8rem; font-size: 0.9rem; }

    footer { background: var(--footer-bg); color: var(--footer-text); padding: 1.5rem 1rem; margin-top: auto; border-top: 1px solid var(--border); }
    .footer-container { max-width: 1000px; margin: 0 auto; display: flex; flex-direction: column; gap: 1rem; align-items: center; text-align: center; }
    .footer-links { display: flex; gap: 1.2rem; flex-wrap: wrap; justify-content: center; }
    .footer-links a { color: var(--footer-text); text-decoration: none; font-weight: 600; font-size: 0.9rem; }

    @media (min-width: 640px) { .footer-container { flex-direction: row; justify-content: space-between; } }
    .toast { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); background: #1e293b; color: white; padding: 0.8rem 1.5rem; border-radius: 999px; font-size: 0.85rem; z-index: 3000; display: none; }
  </style>
</head>
<body>

  <header>
    <h1><a href="./">Laundry Directory V2.0</a></h1>
    <div style="display: flex; gap: 0.5rem; align-items: center;">
      <button class="btn btn-dark" id="dark-mode-toggle">🌙 Mode Gelap</button>
      <a href="./" class="btn btn-primary">← Ke Utama</a>
    </div>
  </header>

  <main class="auth-card">
    <div class="tabs">
      <button class="tab-btn active" id="tab-login">Login</button>
      <button class="tab-btn" id="tab-register">Registrasi Owner</button>
    </div>

    <form id="login-form">
      <div class="form-group"><label>Email</label><input type="email" id="login-email" required></div>
      <div class="form-group"><label>Password</label><input type="password" id="login-password" required></div>
      <button type="submit" class="btn btn-primary" style="width:100%;">Masuk (Login)</button>
    </form>

    <form id="register-form" style="display: none;">
      <div class="form-group"><label>Nama Lengkap Owner</label><input type="text" id="reg-name" required></div>
      <div class="form-group"><label>Email</label><input type="email" id="reg-email" required></div>
      <div class="form-group"><label>Nomor WhatsApp</label><input type="text" id="reg-phone" required placeholder="085712345678"></div>
      <div class="form-group"><label>Password</label><input type="password" id="reg-password" required minlength="6"></div>
      
      <div class="captcha-box">
        <label id="captcha-label" style="font-weight: bold; color: var(--primary);"></label>
        <input type="number" id="captcha-answer" placeholder="Jawaban angka" required style="margin-top:0.4rem; width:100%; padding:0.5rem;">
      </div>

      <button type="submit" class="btn btn-primary" style="width:100%;">Daftar Akun Owner</button>
    </form>
  </main>

  <footer>
    <div class="footer-container">
      <div class="footer-links">
        <a href="./">Halaman Utama</a>
        <a href="#" id="link-contact">Kontak Admin</a>
      </div>
      <div>
        &copy; <span id="current-year"></span> Laundry Directory V2.0.
      </div>
    </div>
  </footer>

  <div class="toast" id="toast"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAY2JOM_GK_c8MIKOOROjG61XtC-VxF3Gc",
      authDomain: "laundry-directory-1915d.firebaseapp.com",
      projectId: "laundry-directory-1915d",
      storageBucket: "laundry-directory-1915d.appspot.com",
      messagingSenderId: "336437234560",
      appId: "1:336437234560:web:69dc7cbb36704c9f614f65"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    document.getElementById("current-year").innerText = new Date().getFullYear();

    const darkToggle = document.getElementById("dark-mode-toggle");
    if (localStorage.getItem("theme") === "dark") {
      document.body.classList.add("dark-mode");
      darkToggle.innerText = "☀️ Mode Terang";
    }
    darkToggle.onclick = () => {
      document.body.classList.toggle("dark-mode");
      const isDark = document.body.classList.contains("dark-mode");
      localStorage.setItem("theme", isDark ? "dark" : "light");
      darkToggle.innerText = isDark ? "☀️ Mode Terang" : "🌙 Mode Gelap";
    };

    document.getElementById("link-contact").onclick = (e) => { e.preventDefault(); alert("Kontak Admin: bandardeterjen@gmail.com"); };

    let num1 = 0, num2 = 0, captchaResult = 0;

    function showToast(msg, isError = false) {
      const toast = document.getElementById("toast");
      toast.innerText = msg;
      toast.style.background = isError ? "#ef4444" : "#16a34a";
      toast.style.display = "block";
      setTimeout(() => { toast.style.display = "none"; }, 3500);
    }

    function generateCaptcha() {
      num1 = Math.floor(Math.random() * 10) + 1;
      num2 = Math.floor(Math.random() * 10) + 1;
      const isAddition = Math.random() > 0.5;

      if (isAddition) {
        captchaResult = num1 + num2;
        document.getElementById("captcha-label").innerText = `Verifikasi: ${num1} + ${num2} = ?`;
      } else {
        if (num1 < num2) [num1, num2] = [num2, num1];
        captchaResult = num1 - num2;
        document.getElementById("captcha-label").innerText = `Verifikasi: ${num1} - ${num2} = ?`;
      }
    }

    const tabLogin = document.getElementById("tab-login");
    const tabRegister = document.getElementById("tab-register");
    const formLogin = document.getElementById("login-form");
    const formRegister = document.getElementById("register-form");

    tabLogin.onclick = () => { tabLogin.classList.add("active"); tabRegister.classList.remove("active"); formLogin.style.display = "block"; formRegister.style.display = "none"; };
    tabRegister.onclick = () => { tabRegister.classList.add("active"); tabLogin.classList.remove("active"); formRegister.style.display = "block"; formLogin.style.display = "none"; generateCaptcha(); };

    formLogin.onsubmit = async (e) => {
      e.preventDefault();
      try {
        const email = document.getElementById("login-email").value.trim();
        const pwd = document.getElementById("login-password").value;

        const cred = await signInWithEmailAndPassword(auth, email, pwd);
        const userDoc = await getDoc(doc(db, "users", cred.user.uid));

        let userData = userDoc.exists() ? userDoc.data() : null;
        if (!userData) {
          const isAdmin = cred.user.email === "bandardeterjen@gmail.com";
          userData = { uid: cred.user.uid, email: cred.user.email, name: isAdmin ? "Admin" : "Owner", role: isAdmin ? "admin" : "owner", status: "approved" };
          await setDoc(doc(db, "users", cred.user.uid), userData);
        }

        if (userData.role !== 'admin' && userData.status !== 'approved') {
          await signOut(auth);
          showToast("Akun Anda masih menunggu persetujuan Admin.", true);
          return;
        }

        showToast("Login Berhasil!");
        setTimeout(() => { window.location.href = "./"; }, 1000);

      } catch (err) { showToast("Gagal Login: " + err.message, true); }
    };

    formRegister.onsubmit = async (e) => {
      e.preventDefault();
      if (parseInt(document.getElementById("captcha-answer").value) !== captchaResult) {
        showToast("Jawaban captcha salah!", true); generateCaptcha(); return;
      }

      try {
        const email = document.getElementById("reg-email").value.trim();
        const cred = await createUserWithEmailAndPassword(auth, email, document.getElementById("reg-password").value);

        await setDoc(doc(db, "users", cred.user.uid), {
          uid: cred.user.uid,
          name: document.getElementById("reg-name").value,
          email: email,
          phone: document.getElementById("reg-phone").value,
          role: "owner", status: "pending",
          createdAt: serverTimestamp()
        });

        await signOut(auth);
        showToast("Registrasi Berhasil! Menunggu approval Admin.", false);
        setTimeout(() => { tabLogin.click(); }, 2000);

      } catch (err) { showToast("Gagal Registrasi: " + err.message, true); generateCaptcha(); }
    };

    generateCaptcha();
  </script>
</body>
</html>
