<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login & Registrasi Owner — Laundry Directory V2.0</title>
  <style>
    :root { --primary: #0284c7; --bg: #f8fafc; --text: #0f172a; --border: #e2e8f0; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
    header { background: white; padding: 1rem; border-bottom: 1px solid var(--border); }
    header h1 a { color: var(--primary); text-decoration: none; font-size: 1.2rem; }
    
    .auth-card { max-width: 400px; margin: 2rem auto; background: white; padding: 1.5rem; border-radius: 8px; border: 1px solid var(--border); width: 90%; }
    .tabs { display: flex; gap: 0.5rem; margin-bottom: 1rem; border-bottom: 1px solid var(--border); }
    .tab-btn { flex: 1; padding: 0.6rem; border: none; background: none; cursor: pointer; font-weight: 600; color: #64748b; }
    .tab-btn.active { color: var(--primary); border-bottom: 2px solid var(--primary); }
    
    .form-group { display: flex; flex-direction: column; gap: 0.3rem; margin-bottom: 0.8rem; }
    .form-group input { padding: 0.6rem; border: 1px solid var(--border); border-radius: 6px; }
    .btn { padding: 0.7rem; border: none; border-radius: 6px; background: var(--primary); color: white; font-weight: 600; cursor: pointer; width: 100%; margin-top: 0.5rem; }
  </style>
</head>
<body>

  <header>
    <h1><a href="./">← Kembali ke Laundry Directory V2.0</a></h1>
  </header>

  <main class="auth-card">
    <div class="tabs">
      <button class="tab-btn active" id="tab-login">Login</button>
      <button class="tab-btn" id="tab-register">Registrasi Owner</button>
    </div>

    <!-- FORM LOGIN -->
    <form id="login-form">
      <div class="form-group"><label>Email</label><input type="email" id="login-email" required></div>
      <div class="form-group"><label>Password</label><input type="password" id="login-password" required></div>
      <button type="submit" class="btn">Masuk (Login)</button>
    </form>

    <!-- FORM REGISTRASI -->
    <form id="register-form" style="display: none;">
      <div class="form-group"><label>Nama Lengkap Owner</label><input type="text" id="reg-name" required></div>
      <div class="form-group"><label>Email</label><input type="email" id="reg-email" required></div>
      <div class="form-group"><label>Nomor WhatsApp</label><input type="text" id="reg-phone" required placeholder="085712345678"></div>
      <div class="form-group"><label>Password</label><input type="password" id="reg-password" required minlength="6"></div>
      <button type="submit" class="btn">Daftar Akun Owner</button>
    </form>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAY2JOM_GK_c8MIKOOROjG61XtC-VxF3Gc",
      authDomain: "laundry-directory-1915d.firebaseapp.com",
      projectId: "laundry-directory-1915d",
      storageBucket: "laundry-directory-1915d.appspot.com",
      messagingSenderId: "336437234560",
      appId: "1:336437234560:web:69dc7cbb36704c9f614f65"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // Tab Switcher Logic
    const tabLogin = document.getElementById("tab-login");
    const tabRegister = document.getElementById("tab-register");
    const formLogin = document.getElementById("login-form");
    const formRegister = document.getElementById("register-form");

    tabLogin.onclick = () => {
      tabLogin.classList.add("active"); tabRegister.classList.remove("active");
      formLogin.style.display = "block"; formRegister.style.display = "none";
    };
    tabRegister.onclick = () => {
      tabRegister.classList.add("active"); tabLogin.classList.remove("active");
      formRegister.style.display = "block"; formLogin.style.display = "none";
    };

    // Handler Login
    formLogin.onsubmit = async (e) => {
      e.preventDefault();
      try {
        await signInWithEmailAndPassword(auth, document.getElementById("login-email").value, document.getElementById("login-password").value);
        alert("Login berhasil!");
        window.location.href = "./";
      } catch (err) { alert("Gagal Login: " + err.message); }
    };

    // Handler Register
    formRegister.onsubmit = async (e) => {
      e.preventDefault();
      try {
        const email = document.getElementById("reg-email").value;
        const pwd = document.getElementById("reg-password").value;
        const cred = await createUserWithEmailAndPassword(auth, email, pwd);

        await setDoc(doc(db, "users", cred.user.uid), {
          uid: cred.user.uid,
          name: document.getElementById("reg-name").value,
          email: email,
          phone: document.getElementById("reg-phone").value,
          role: "owner",
          createdAt: serverTimestamp()
        });

        alert("Registrasi Berhasil! Anda otomatis masuk.");
        window.location.href = "./";
      } catch (err) { alert("Gagal Registrasi: " + err.message); }
    };
  </script>
</body>
</html>
