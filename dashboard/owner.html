<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Owner Dashboard — Laundry Directory V2.0</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .dashboard-layout { display: grid; grid-template-columns: 1fr; gap: 1.5rem; max-width: 1100px; margin: 1.5rem auto; padding: 0 1rem; }
    @media(min-width: 768px) { .dashboard-layout { grid-template-columns: 320px 1fr; } }
    .sidebar { background: white; border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem; display: flex; flex-direction: column; gap: 0.5rem; height: fit-content; }
    .sidebar button { text-align: left; justify-content: flex-start; }
    #picker-map { height: 200px; width: 100%; border-radius: 8px; margin-top: 0.3rem; }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <h1><a href="../index.html">Laundry Directory V2.0</a></h1>
      <p>Owner Control Panel</p>
    </div>
    <button id="logout-btn" class="btn btn-secondary">Logout</button>
  </header>

  <main class="dashboard-layout">
    <aside class="sidebar">
      <div style="margin-bottom:0.5rem;">
        <strong id="owner-name" style="color:var(--primary); display:block;">Halo, Owner</strong>
        <small id="owner-email" style="color:var(--text-muted);"></small>
      </div>
      <hr style="border:0; border-top:1px solid var(--border);">
      <button class="btn btn-secondary active-tab" id="tab-businesses">🏬 Bisnis Saya</button>
      <button class="btn btn-secondary" id="tab-notifications">🔔 Notifikasi Internal</button>
    </aside>

    <section id="content-area">
      <!-- Dynamic Section content -->
    </section>
  </main>

  <!-- Modal Form Tambah/Edit Bisnis -->
  <div class="modal" id="business-modal">
    <div class="modal-content" style="max-width:600px;">
      <button class="close-btn" id="close-modal">&times;</button>
      <h2 id="modal-form-title" style="color:var(--primary);">Tambah Usaha Baru</h2>
      <form id="owner-business-form" style="display:flex; flex-direction:column; gap:0.6rem; margin-top:1rem;">
        <input type="hidden" id="b-id">
        <div class="form-group"><label>Nama Usaha</label><input type="text" id="b-name" required></div>
        <div class="form-group"><label>Kategori</label>
          <select id="b-category" required>
            <option value="Laundry Kiloan" data-slug="laundry">Laundry Kiloan</option>
            <option value="Laundry Satuan" data-slug="laundry">Laundry Satuan</option>
            <option value="Cuci Sepatu" data-slug="cuci-sepatu">Cuci Sepatu</option>
            <option value="Cuci Sofa" data-slug="cuci-sofa">Cuci Sofa</option>
            <option value="Home Cleaning" data-slug="home-cleaning">Home Cleaning</option>
            <option value="Car Wash" data-slug="car-wash">Car Wash</option>
          </select>
        </div>
        <div class="form-group"><label>Deskripsi</label><textarea id="b-description" rows="2"></textarea></div>
        <div class="form-group"><label>Alamat Jalan</label><input type="text" id="b-address" required></div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:0.5rem;">
          <div class="form-group"><label>Kota</label><input type="text" id="b-city" required></div>
          <div class="form-group"><label>Provinsi</label><input type="text" id="b-province" required></div>
        </div>
        <div class="form-group">
          <label>Lokasi Koordinat Peta (Klik Pada Peta)</label>
          <div id="picker-map"></div>
        </div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:0.5rem;">
          <div class="form-group"><label>Latitude</label><input type="number" step="any" id="b-latitude" required readonly></div>
          <div class="form-group"><label>Longitude</label><input type="number" step="any" id="b-longitude" required readonly></div>
        </div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:0.5rem;">
          <div class="form-group"><label>Telepon</label><input type="text" id="b-phone"></div>
          <div class="form-group"><label>WhatsApp</label><input type="text" id="b-whatsapp" required></div>
        </div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:0.5rem;">
          <div class="form-group"><label>Website</label><input type="url" id="b-website"></div>
          <div class="form-group"><label>Instagram</label><input type="text" id="b-instagram"></div>
        </div>
        <div class="form-group"><label>URL Logo/Foto</label><input type="url" id="b-imageUrl"></div>
        
        <button type="submit" class="btn btn-primary" style="margin-top:0.5rem;">Simpan Usaha</button>
      </form>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module">
    import { requireAuth, logoutUser } from '../js/auth.js';
    import { db, storage } from '../js/firebase-config.js';
    import { createSlug } from '../js/business.js';
    import { requestVerification } from '../js/verification.js';
    import { collection, query, where, getDocs, addDoc, doc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    let currentUser = null;
    let pickerMap, pickerMarker;

    requireAuth('owner', (user, userData) => {
      currentUser = user;
      document.getElementById("owner-name").innerText = `Halo, ${userData?.name || 'Owner'}`;
      document.getElementById("owner-email").innerText = user.email;
      loadOwnerBusinesses();
    });

    document.getElementById("logout-btn").onclick = logoutUser;

    async function loadOwnerBusinesses() {
      const area = document.getElementById("content-area");
      area.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
          <h2 style="font-size:1.2rem; color:var(--primary);">Bisnis Saya</h2>
          <button id="add-b-btn" class="btn btn-primary">+ Tambahkan Usaha</button>
        </div>
        <div id="business-cards-list" style="display:flex; flex-direction:column; gap:1rem;">Memuat daftar bisnis...</div>
      `;

      document.getElementById("add-b-btn").onclick = () => openBusinessModal();

      const q = query(collection(db, "businesses"), where("ownerId", "==", currentUser.uid));
      const snap = await getDocs(q);
      const listEl = document.getElementById("business-cards-list");
      listEl.innerHTML = "";

      if (snap.empty) {
        listEl.innerHTML = `<div class="empty-state"><p>Anda belum memiliki listing bisnis.</p></div>`;
        return;
      }

      snap.forEach(docSnap => {
        const b = { id: docSnap.id, ...docSnap.data() };
        const card = document.createElement("div");
        card.className = "detail-card";
        card.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:flex-start;">
            <div>
              <span class="badge">${b.category}</span>
              <h3 style="font-size:1.1rem; margin-top:0.2rem;">${b.name}</h3>
              <small style="color:var(--text-muted);">📍 ${b.city}</small>
            </div>
            <div>
              <span class="badge" style="background:${b.status === 'active' ? '#dcfce7':'#fef3c7'}; color:${b.status === 'active' ? '#15803d':'#b45309'};">${b.status}</span>
              <span class="badge" style="background:${b.verificationStatus === 'verified' ? '#e0f2fe':'#f1f5f9'}; color:${b.verificationStatus === 'verified' ? '#0369a1':'#64748b'};">${b.verificationStatus}</span>
            </div>
          </div>
          <div style="display:flex; gap:0.5rem; margin-top:0.5rem;">
            <button class="btn btn-secondary" style="font-size:0.8rem;" id="edit-${b.id}">Kelola / Edit</button>
            ${b.verificationStatus === 'unverified' ? `<button class="btn btn-whatsapp" style="font-size:0.8rem;" id="verif-${b.id}">Request Verification</button>` : ''}
          </div>
        `;
        listEl.appendChild(card);

        setTimeout(() => {
          document.getElementById(`edit-${b.id}`).onclick = () => openBusinessModal(b);
          if (document.getElementById(`verif-${b.id}`)) {
            document.getElementById(`verif-${b.id}`).onclick = () => handleRequestVerification(b.id);
          }
        }, 0);
      });
    }

    function openBusinessModal(b = null) {
      document.getElementById("business-modal").classList.add("active");
      if (!pickerMap) initPickerMap();

      if (b) {
        document.getElementById("modal-form-title").innerText = "Edit Bisnis";
        document.getElementById("b-id").value = b.id;
        document.getElementById("b-name").value = b.name;
        document.getElementById("b-category").value = b.category;
        document.getElementById("b-description").value = b.description || '';
        document.getElementById("b-address").value = b.address;
        document.getElementById("b-city").value = b.city;
        document.getElementById("b-province").value = b.province;
        document.getElementById("b-latitude").value = b.latitude;
        document.getElementById("b-longitude").value = b.longitude;
        document.getElementById("b-phone").value = b.phone || '';
        document.getElementById("b-whatsapp").value = b.whatsapp;
        document.getElementById("b-website").value = b.website || '';
        document.getElementById("b-instagram").value = b.instagram || '';
        document.getElementById("b-imageUrl").value = b.imageUrl || '';
        setPickerLocation(b.latitude, b.longitude);
      } else {
        document.getElementById("modal-form-title").innerText = "Tambah Usaha Baru";
        document.getElementById("owner-business-form").reset();
        document.getElementById("b-id").value = "";
      }
    }

    document.getElementById("close-modal").onclick = () => {
      document.getElementById("business-modal").classList.remove("active");
    };

    function initPickerMap() {
      pickerMap = L.map("picker-map").setView([-6.4025, 106.9680], 12);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(pickerMap);
      pickerMap.on("click", (e) => setPickerLocation(e.latlng.lat, e.latlng.lng));
    }

    function setPickerLocation(lat, lng) {
      document.getElementById("b-latitude").value = lat;
      document.getElementById("b-longitude").value = lng;
      if (pickerMarker) pickerMap.removeLayer(pickerMarker);
      pickerMarker = L.marker([lat, lng]).addTo(pickerMap);
      pickerMap.setView([lat, lng], 14);
    }

    document.getElementById("owner-business-form").onsubmit = async (e) => {
      e.preventDefault();
      const id = document.getElementById("b-id").value;
      const catSelect = document.getElementById("b-category");
      const selectedOpt = catSelect.options[catSelect.selectedIndex];

      const payload = {
        name: document.getElementById("b-name").value,
        slug: createSlug(document.getElementById("b-name").value),
        category: catSelect.value,
        categorySlug: selectedOpt.dataset.slug || 'laundry',
        description: document.getElementById("b-description").value,
        address: document.getElementById("b-address").value,
        city: document.getElementById("b-city").value,
        citySlug: createSlug(document.getElementById("b-city").value),
        province: document.getElementById("b-province").value,
        provinceSlug: createSlug(document.getElementById("b-province").value),
        latitude: parseFloat(document.getElementById("b-latitude").value),
        longitude: parseFloat(document.getElementById("b-longitude").value),
        phone: document.getElementById("b-phone").value,
        whatsapp: document.getElementById("b-whatsapp").value,
        website: document.getElementById("b-website").value,
        instagram: document.getElementById("b-instagram").value,
        imageUrl: document.getElementById("b-imageUrl").value,
        updatedAt: serverTimestamp()
      };

      if (id) {
        await updateDoc(doc(db, "businesses", id), payload);
      } else {
        payload.ownerId = currentUser.uid;
        payload.status = "pending";
        payload.verificationStatus = "unverified";
        payload.createdAt = serverTimestamp();
        await addDoc(collection(db, "businesses"), payload);
      }

      document.getElementById("business-modal").classList.remove("active");
      loadOwnerBusinesses();
    };

    async function handleRequestVerification(businessId) {
      const fileInput = document.createElement("input");
      fileInput.type = "file";
      fileInput.multiple = true;
      fileInput.accept = "image/*,.pdf";
      fileInput.onchange = async () => {
        if (fileInput.files.length === 0) return;
        const notes = prompt("Masukkan catatan pendukung untuk admin verifikasi:");
        try {
          alert("Mengunggah dokumen bukti verifikasi...");
          await requestVerification(businessId, currentUser.uid, Array.from(fileInput.files), notes || "");
          alert("Permintaan verifikasi berhasil diajukan!");
          loadOwnerBusinesses();
        } catch (err) {
          alert("Gagal: " + err.message);
        }
      };
      fileInput.click();
    }
  </script>
</body>
</html>
