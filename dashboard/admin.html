<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard V2.0 — Laundry Directory</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .admin-layout { max-width: 1200px; margin: 1.5rem auto; padding: 0 1rem; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
    .stat-card { background: white; padding: 1rem; border-radius: var(--radius); border: 1px solid var(--border); text-align: center; }
    .stat-card h3 { font-size: 1.5rem; color: var(--primary); }
    table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); margin-top: 1rem; }
    th, td { padding: 0.75rem; text-align: left; border-bottom: 1px solid var(--border); font-size: 0.85rem; }
    th { background: #f1f5f9; }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <h1><a href="../index.html">Laundry Directory Admin V2.0</a></h1>
    </div>
    <button id="logout-btn" class="btn btn-secondary">Logout</button>
  </header>

  <main class="admin-layout">
    <div class="stats-grid">
      <div class="stat-card"><h3 id="stat-total-b">0</h3><small>Total Bisnis</small></div>
      <div class="stat-card"><h3 id="stat-active-b">0</h3><small>Bisnis Aktif</small></div>
      <div class="stat-card"><h3 id="stat-claims">0</h3><small>Pending Claims</small></div>
      <div class="stat-card"><h3 id="stat-verifs">0</h3><small>Pending Verifikations</small></div>
    </div>

    <div style="display:flex; gap:0.5rem; margin-bottom:1rem;">
      <button class="btn btn-primary" id="nav-claims">Manage Claims</button>
      <button class="btn btn-secondary" id="nav-verifs">Manage Verifications</button>
      <button class="btn btn-secondary" id="nav-businesses">All Businesses</button>
    </div>

    <section id="admin-table-area"></section>
  </main>

  <script type="module">
    import { requireAuth, logoutUser } from '../js/auth.js';
    import { db } from '../js/firebase-config.js';
    import { approveClaim, rejectClaim } from '../js/claim.js';
    import { approveVerification } from '../js/verification.js';
    import { collection, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    let adminUser = null;

    requireAuth('admin', (user) => {
      adminUser = user;
      loadClaimsTable();
      loadStats();
    });

    document.getElementById("logout-btn").onclick = logoutUser;

    async function loadStats() {
      const bSnap = await getDocs(collection(db, "businesses"));
      document.getElementById("stat-total-b").innerText = bSnap.size;
      
      let activeCount = 0;
      bSnap.forEach(d => { if(d.data().status === 'active') activeCount++; });
      document.getElementById("stat-active-b").innerText = activeCount;

      const cSnap = await getDocs(collection(db, "claims"));
      let pendingClaims = 0;
      cSnap.forEach(d => { if(d.data().status === 'pending') pendingClaims++; });
      document.getElementById("stat-claims").innerText = pendingClaims;

      const vSnap = await getDocs(collection(db, "verificationRequests"));
      let pendingVerifs = 0;
      vSnap.forEach(d => { if(d.data().status === 'pending') pendingVerifs++; });
      document.getElementById("stat-verifs").innerText = pendingVerifs;
    }

    document.getElementById("nav-claims").onclick = loadClaimsTable;
    document.getElementById("nav-verifs").onclick = loadVerificationsTable;

    async function loadClaimsTable() {
      const area = document.getElementById("admin-table-area");
      area.innerHTML = `<h3>Pending Business Claims</h3><table><thead><tr><th>Claimant</th><th>Message</th><th>Status</th><th>Aksi</th></tr></thead><tbody id="tbl-body"></tbody></table>`;
      
      const snap = await getDocs(collection(db, "claims"));
      const tbody = document.getElementById("tbl-body");
      tbody.innerHTML = "";

      snap.forEach(docSnap => {
        const c = { id: docSnap.id, ...docSnap.data() };
        if (c.status !== 'pending') return;

        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td><strong>${c.name}</strong><br><small>${c.email}</small></td>
          <td>${c.message}</td>
          <td><span class="badge">${c.status}</span></td>
          <td>
            <button class="btn btn-whatsapp" style="font-size:0.75rem;" id="appc-${c.id}">Approve</button>
            <button class="btn btn-danger" style="font-size:0.75rem;" id="rejc-${c.id}">Reject</button>
          </td>
        `;
        tbody.appendChild(tr);

        setTimeout(() => {
          document.getElementById(`appc-${c.id}`).onclick = async () => {
            await approveClaim(c.id, c.businessId, c.userId, adminUser.uid);
            alert("Klaim disetujui!");
            loadClaimsTable();
          };
          document.getElementById(`rejc-${c.id}`).onclick = async () => {
            await rejectClaim(c.id, c.userId, adminUser.uid);
            alert("Klaim ditolak.");
            loadClaimsTable();
          };
        }, 0);
      });
    }

    async function loadVerificationsTable() {
      const area = document.getElementById("admin-table-area");
      area.innerHTML = `<h3>Pending Verification Requests</h3><table><thead><tr><th>Owner UID</th><th>Documents</th><th>Notes</th><th>Aksi</th></tr></thead><tbody id="tbl-body"></tbody></table>`;
      
      const snap = await getDocs(collection(db, "verificationRequests"));
      const tbody = document.getElementById("tbl-body");
      tbody.innerHTML = "";

      snap.forEach(docSnap => {
        const v = { id: docSnap.id, ...docSnap.data() };
        if (v.status !== 'pending') return;

        const docsHtml = v.documents.map(d => `<a href="${d}" target="_blank">Doc File</a>`).join(', ');

        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${v.ownerId}</td>
          <td>${docsHtml}</td>
          <td>${v.notes || '-'}</td>
          <td>
            <button class="btn btn-whatsapp" style="font-size:0.75rem;" id="appv-${v.id}">Approve</button>
          </td>
        `;
        tbody.appendChild(tr);

        setTimeout(() => {
          document.getElementById(`appv-${v.id}`).onclick = async () => {
            await approveVerification(v.id, v.businessId, v.ownerId, adminUser.uid);
            alert("Verifikasi disetujui!");
            loadVerificationsTable();
          };
        }, 0);
      });
    }
  </script>
</body>
</html>
