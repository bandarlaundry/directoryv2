<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memuat Detail Usaha... — Laundry Directory V2.0</title>
  <meta id="meta-desc" name="description" content="Informasi detail layanan laundry dan cleaning service.">
  <link id="canonical-url" rel="canonical" href="" />

  <!-- Open Graph -->
  <meta id="og-title" property="og:title" content="Memuat..." />
  <meta id="og-desc" property="og:description" content="..." />
  <meta id="og-url" property="og:url" content="" />
  <meta id="og-image" property="og:image" content="" />

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="../css/style.css">
  <script id="json-ld-schema" type="application/ld+json"></script>
</head>
<body>

  <header class="app-header">
    <div class="brand">
      <h1><a href="../index.html">Laundry Directory V2.0</a></h1>
      <p>Halaman Detail Resmi Usaha</p>
    </div>
    <a href="../index.html" class="btn btn-secondary">← Kembali ke Peta</a>
  </header>

  <main class="detail-container">
    <article class="detail-card" id="detail-card">
      <div class="loading-state">Memuat data lengkap usaha...</div>
    </article>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module">
    import { fetchBusinessBySlug } from '../js/business.js';
    import { auth } from '../js/firebase-config.js';
    import { submitClaim } from '../js/claim.js';
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    let currentBusiness = null;
    let currentUser = null;

    document.addEventListener("DOMContentLoaded", async () => {
      onAuthStateChanged(auth, (user) => { currentUser = user; });

      const pathSegments = window.location.pathname.split('/').filter(Boolean);
      const slug = pathSegments[pathSegments.length - 1];

      try {
        currentBusiness = await fetchBusinessBySlug(slug);
        if (!currentBusiness) return showError("Usaha tidak ditemukan.");

        renderBusinessDetail(currentBusiness);
        injectSEOMetadata(currentBusiness);
      } catch (err) {
        showError("Gagal memuat data usaha.");
      }
    });

    function renderBusinessDetail(b) {
      let waNum = b.whatsapp ? b.whatsapp.replace(/[^0-9]/g, '') : '';
      if (waNum.startsWith('0')) waNum = '62' + waNum.slice(1);
      const waMsg = encodeURIComponent("Halo, saya menemukan usaha Anda melalui Laundry Directory.");
      const waUrl = waNum ? `https://wa.me/${waNum}?text=${waMsg}` : '#';
      const mapsUrl = `https://www.google.com/maps/dir/?api=1&destination=${b.latitude},${b.longitude}`;

      // Badge Verifikasi
      let verificationBadgeHtml = '';
      if (b.verificationStatus === 'verified') {
        verificationBadgeHtml = `<span class="badge" style="background:#dcfce7; color:#15803d; border:1px solid #86efac; font-size:0.85rem;">✓ Verified Business</span>`;
      } else if (b.ownerId) {
        verificationBadgeHtml = `<span class="badge" style="background:#f1f5f9; color:#475569;">Business Owner Claimed</span>`;
      }

      // Banner Klaim Bisnis
      let claimBannerHtml = '';
      if (!b.ownerId) {
        claimBannerHtml = `
          <div style="background:#f0f9ff; border:1px solid #bae6fd; border-radius:8px; padding:1rem; margin-top:1rem; display:flex; justify-content:space-between; align-items:center;">
            <div>
              <strong style="color:#0369a1; font-size:0.9rem;">Apakah Anda pemilik usaha ini?</strong>
              <p style="font-size:0.8rem; color:#0284c7;">Klaim bisnis ini untuk mengelola informasi dan verifikasi resmi.</p>
            </div>
            <button id="claim-btn" class="btn btn-primary" style="font-size:0.8rem;">Claim Business</button>
          </div>
        `;
      }

      const container = document.getElementById("detail-card");
      container.innerHTML = `
        ${b.imageUrl ? `<img src="${b.imageUrl}" style="width:100%; height:240px; object-fit:cover; border-radius:8px;" alt="${b.name}">` : ''}
        
        <div style="display:flex; justify-content:space-between; align-items:flex-start;">
          <div>
            <span class="badge">${b.category}</span>
            <h1 style="font-size:1.6rem; color:var(--primary); margin-top:0.4rem;">${b.name} ${b.city}</h1>
          </div>
          ${verificationBadgeHtml}
        </div>

        <p style="color:var(--text-muted); font-size:0.95rem; line-height:1.5;">${b.description || 'Layanan profesional, cepat, dan terpercaya.'}</p>

        <hr style="border:0; border-top:1px solid var(--border);">

        <div style="display:flex; flex-direction:column; gap:8px; font-size:0.9rem;">
          <div><strong>📍 Alamat:</strong> ${b.address}, ${b.city}, ${b.province}</div>
          <div><strong>🕒 Jam Operasional:</strong> ${b.openingHours || '-'}</div>
          <div><strong>📞 Telepon:</strong> ${b.phone || '-'}</div>
          ${b.website ? `<div><strong>🌐 Website:</strong> <a href="${b.website}" target="_blank">${b.website}</a></div>` : ''}
          ${b.instagram ? `<div><strong>📷 Instagram:</strong> ${b.instagram}</div>` : ''}
        </div>

        <div class="detail-actions" style="margin-top:1rem;">
          <a href="${waUrl}" target="_blank" class="btn btn-whatsapp">💬 WhatsApp</a>
          <a href="tel:${b.phone || ''}" class="btn btn-secondary">📞 Telepon</a>
          <a href="${mapsUrl}" target="_blank" class="btn btn-primary">🧭 Petunjuk Arah</a>
        </div>

        ${claimBannerHtml}

        <h3 style="font-size:1.1rem; margin-top:1rem;">Lokasi Peta</h3>
        <div id="detail-map"></div>
      `;

      // Handlers Klik Klaim
      if (document.getElementById("claim-btn")) {
        document.getElementById("claim-btn").onclick = async () => {
          if (!currentUser) {
            alert("Silakan login atau mendaftar akun terlebih dahulu untuk melakukan klaim.");
            window.location.href = '../auth/login.html';
            return;
          }

          const msg = prompt("Masukkan pesan/bukti singkat bahwa Anda adalah pemilik usaha ini:");
          if (msg) {
            try {
              await submitClaim(b.id, currentUser.uid, {
                name: currentUser.displayName || "Owner",
                email: currentUser.email,
                phone: "-"
              }, msg);
              alert("Permintaan klaim berhasil dikirim! Silakan tunggu peninjauan dari admin.");
            } catch (err) {
              alert("Gagal klaim: " + err.message);
            }
          }
        };
      }

      // Map Render
      if (b.latitude && b.longitude) {
        const dMap = L.map('detail-map').setView([b.latitude, b.longitude], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(dMap);
        L.marker([b.latitude, b.longitude]).addTo(dMap).bindPopup(b.name).openPopup();
      }
    }

    function injectSEOMetadata(b) {
      const pageTitle = `${b.name} ${b.city} ${b.verificationStatus === 'verified' ? '✓ Verified' : ''} — ${b.category} | Laundry Directory`;
      const pageDesc = `${b.name} di ${b.city} melayani ${b.category}. Lihat alamat lengkap, WhatsApp, jam operasional, dan lokasi peta.`;

      document.title = pageTitle;
      document.getElementById("meta-desc").setAttribute("content", pageDesc);
      document.getElementById("canonical-url").setAttribute("href", window.location.href);
      document.getElementById("og-title").setAttribute("content", pageTitle);
      document.getElementById("og-desc").setAttribute("content", pageDesc);
    }

    function showError(msg) {
      document.getElementById("detail-card").innerHTML = `<div class="empty-state"><h2>${msg}</h2></div>`;
    }
  </script>
</body>
</html>
