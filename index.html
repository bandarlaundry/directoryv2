<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laundry Directory V2.0 — Directory & Map</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    :root {
      --primary: #0284c7;
      --bg: #f8fafc;
      --surface: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }

    header { background: var(--surface); padding: 1rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 1.2rem; color: var(--primary); }

    .btn { padding: 0.5rem 0.9rem; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.85rem; text-decoration: none; display: inline-block; }
    .btn-primary { background: var(--primary); color: white; }
    .btn-secondary { background: #e2e8f0; color: var(--text); }
    .btn-danger { background: #ef4444; color: white; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Peta Utama di Atas */
    #map { width: 100%; height: 380px; background: #cbd5e1; z-index: 1; }

    .container { max-width: 1000px; margin: 1rem auto; padding: 0 1rem; width: 100%; }
    .controls { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
    .controls input { flex: 1; padding: 0.6rem; border: 1px solid var(--border); border-radius: 6px; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1rem; }
    .card { background: white; padding: 1rem; border-radius: 8px; border: 1px solid var(--border); display: flex; flex-direction: column; gap: 0.5rem; }
    .card-title { color: var(--primary); font-weight: 700; text-decoration: none; font-size: 1.05rem; }
    .card-title:hover { text-decoration: underline; }
    .badge { background: #e0f2fe; color: #0369a1; padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; width: fit-content; }

    .pagination { display: flex; justify-content: center; gap: 0.3rem; margin: 1.5rem 0; }
    .page-btn { padding: 0.4rem 0.8rem; border: 1px solid var(--border); background: white; border-radius: 4px; cursor: pointer; }
    .page-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
    .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Modal Form Tambah Data */
    .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 2000; align-items: center; justify-content: center; padding: 1rem; }
    .modal.active { display: flex; }
    .modal-content { background: white; border-radius: 8px; width: 100%; max-width: 550px; max-height: 90vh; overflow-y: auto; padding: 1.5rem; }
    .form-group { display: flex; flex-direction: column; gap: 0.3rem; margin-bottom: 0.8rem; }
    .form-group input, .form-group select { padding: 0.6rem; border: 1px solid var(--border); border-radius: 6px; }

    /* Peta Location Picker di Dalam Form Modal */
    #picker-map {
      width: 100%;
      height: 220px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #cbd5e1;
      margin-top: 0.3rem;
    }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>Laundry Directory V2.0</h1>
      <small style="color:var(--text-muted);" id="user-status-text">Memuat status...</small>
    </div>
    <div id="auth-buttons-wrapper">
      <a href="./auth.html" class="btn btn-primary">🔑 Login / Register</a>
    </div>
  </header>

  <!-- Peta Utama di Atas -->
  <div id="map"></div>

  <main class="container">
    <div class="controls">
      <input type="text" id="search" placeholder="Cari laundry, cuci sepatu, kota...">
      <button id="add-data-btn" class="btn btn-primary" style="display:none;">+ Tambah Usaha</button>
      <!-- Tombol Seed Khusus Admin & Muncul Jika Belum Pernah Dieksekusi -->
      <button id="seed-btn" class="btn btn-secondary" style="display:none;">🌱 Seed 15 Dummy (Admin)</button>
    </div>

    <!-- Container Data -->
    <div id="data-list" class="grid">
      <div style="grid-column: 1/-1; text-align: center; padding: 2rem;">Memuat data usaha...</div>
    </div>

    <!-- Pagination Controls -->
    <div class="pagination" id="pagination" style="display: none;">
      <button class="page-btn" id="p-first">&lt;&lt;</button>
      <button class="page-btn" id="p-prev">&lt;</button>
      <div id="p-numbers" style="display: flex; gap: 0.3rem;"></div>
      <button class="page-btn" id="p-next">&gt;</button>
      <button class="page-btn" id="p-last">&gt;&gt;</button>
    </div>
  </main>

  <!-- FORM MODAL TAMBAH/EDIT USAHA -->
  <div class="modal" id="add-modal">
    <div class="modal-content">
      <h2 style="color:var(--primary); margin-bottom:1rem;" id="modal-title">Tambah Usaha Baru</h2>
      <form id="add-form">
        <input type="hidden" id="f-id">
        <div class="form-group"><label>Nama Usaha</label><input type="text" id="f-name" required placeholder="Contoh: Bandar Laundry"></div>
        <div class="form-group"><label>Kategori</label>
          <select id="f-category" required>
            <option value="Laundry Kiloan">Laundry Kiloan</option>
            <option value="Laundry Satuan">Laundry Satuan</option>
            <option value="Cuci Sepatu">Cuci Sepatu</option>
            <option value="Cuci Sofa">Cuci Sofa</option>
            <option value="Home Cleaning">Home Cleaning</option>
            <option value="Car Wash">Car Wash</option>
          </select>
        </div>

        <!-- DROPDOWN PROVINSI INDONESIA -->
        <div class="form-group"><label>Provinsi</label>
          <select id="f-province" required>
            <option value="">-- Pilih Provinsi --</option>
            <option value="Aceh">Aceh</option>
            <option value="Bali">Bali</option>
            <option value="Banten">Banten</option>
            <option value="Bengkulu">Bengkulu</option>
            <option value="DI Yogyakarta">DI Yogyakarta</option>
            <option value="DKI Jakarta">DKI Jakarta</option>
            <option value="Gorontalo">Gorontalo</option>
            <option value="Jambi">Jambi</option>
            <option value="Jawa Barat">Jawa Barat</option>
            <option value="Jawa Tengah">Jawa Tengah</option>
            <option value="Jawa Timur">Jawa Timur</option>
            <option value="Kalimantan Barat">Kalimantan Barat</option>
            <option value="Kalimantan Selatan">Kalimantan Selatan</option>
            <option value="Kalimantan Tengah">Kalimantan Tengah</option>
            <option value="Kalimantan Timur">Kalimantan Timur</option>
            <option value="Kalimantan Utara">Kalimantan Utara</option>
            <option value="Kepulauan Bangka Belitung">Kepulauan Bangka Belitung</option>
            <option value="Kepulauan Riau">Kepulauan Riau</option>
            <option value="Lampung">Lampung</option>
            <option value="Maluku">Maluku</option>
            <option value="Maluku Utara">Maluku Utara</option>
            <option value="Nusa Tenggara Barat">Nusa Tenggara Barat</option>
            <option value="Nusa Tenggara Timur">Nusa Tenggara Timur</option>
            <option value="Papua">Papua</option>
            <option value="Papua Barat">Papua Barat</option>
            <option value="Papua Barat Daya">Papua Barat Daya</option>
            <option value="Papua Pegunungan">Papua Pegunungan</option>
            <option value="Papua Selatan">Papua Selatan</option>
            <option value="Papua Tengah">Papua Tengah</option>
            <option value="Riau">Riau</option>
            <option value="Sulawesi Barat">Sulawesi Barat</option>
            <option value="Sulawesi Selatan">Sulawesi Selatan</option>
            <option value="Sulawesi Tengah">Sulawesi Tengah</option>
            <option value="Sulawesi Tenggara">Sulawesi Tenggara</option>
            <option value="Sulawesi Utara">Sulawesi Utara</option>
            <option value="Sumatera Barat">Sumatera Barat</option>
            <option value="Sumatera Selatan">Sumatera Selatan</option>
            <option value="Sumatera Utara">Sumatera Utara</option>
          </select>
        </div>

        <div class="form-group"><label>Kota / Kabupaten</label><input type="text" id="f-city" required placeholder="Ketik nama kota (misal: Bogor, Surabaya)"></div>
        <div class="form-group"><label>Alamat Jalan</label><input type="text" id="f-address" required placeholder="Jl. Raya No. 12"></div>

        <div class="form-group">
          <label>Pilih Lokasi di Peta Indonesia (Klik pada posisi usaha)</label>
          <div id="picker-map"></div>
          <small style="color:var(--text-muted);">Peta otomatis menyesuaikan saat nama Kota/Provinsi diisi. Pin terkunci di wilayah Indonesia.</small>
        </div>

        <div style="display:grid; grid-template-columns:1fr 1fr; gap:0.5rem;">
          <div class="form-group"><label>Latitude</label><input type="number" step="any" id="f-lat" required readonly style="background:#f1f5f9;"></div>
          <div class="form-group"><label>Longitude</label><input type="number" step="any" id="f-lng" required readonly style="background:#f1f5f9;"></div>
        </div>

        <div class="form-group"><label>WhatsApp</label><input type="text" id="f-wa" required placeholder="085712345678"></div>

        <div style="display:flex; gap:0.5rem; margin-top:1rem;">
          <button type="submit" class="btn btn-primary" style="flex:1;">Simpan Data Usaha</button>
          <button type="button" class="btn btn-secondary" id="close-modal-btn">Batal</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, getDoc, addDoc, doc, updateDoc, setDoc, query, where, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAY2JOM_GK_c8MIKOOROjG61XtC-VxF3Gc",
      authDomain: "laundry-directory-1915d.firebaseapp.com",
      projectId: "laundry-directory-1915d",
      storageBucket: "laundry-directory-1915d.appspot.com",
      messagingSenderId: "336437234560",
      appId: "1:336437234560:web:69dc7cbb36704c9f614f65"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let mainMap, mainMarkersGroup, pickerMap, pickerMarker;
    let rawData = [];
    let filteredData = [];
    let currentPage = 1;
    const PER_PAGE = 10;
    let currentUser = null;

    // BATASAN KOORDINAT WILAYAH INDONESIA
    const INDONESIA_BOUNDS = L.latLngBounds(
      L.latLng(-11.1, 95.0),  // Barat Daya (South-West)
      L.latLng(6.2, 141.0)    // Timur Laut (North-East)
    );

    function getBasePath() { return window.location.pathname.startsWith('/directoryv2') ? '/directoryv2' : ''; }
    function createSlug(text) { return text.toString().toLowerCase().trim().replace(/\s+/g, '-').replace(/[^\w\-]+/g, ''); }

    // 1. Inisialisasi Peta Utama
    function initMainMap() {
      mainMap = L.map('map', {
        maxBounds: INDONESIA_BOUNDS,
        maxBoundsViscosity: 1.0,
        minZoom: 5
      }).setView([-2.5489, 118.0149], 5); // Center Indonesia

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(mainMap);
      mainMarkersGroup = L.layerGroup().addTo(mainMap);
      setTimeout(() => mainMap.invalidateSize(), 300);
    }

    // 2. Inisialisasi Peta Location Picker dengan Boundary Terkunci
    function initPickerMap() {
      if (pickerMap) return;

      pickerMap = L.map('picker-map', {
        maxBounds: INDONESIA_BOUNDS,
        maxBoundsViscosity: 1.0,
        minZoom: 5
      }).setView([-6.4025, 106.9680], 12);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(pickerMap);

      pickerMap.on('click', (e) => {
        // Validasi Apakah Klik Masih Dalam Batas Indonesia
        if (INDONESIA_BOUNDS.contains(e.latlng)) {
          setPickerLocation(e.latlng.lat, e.latlng.lng);
        } else {
          alert("⚠️ Penandaan lokasi hanya dapat dilakukan di wilayah Republik Indonesia!");
        }
      });
    }

    function setPickerLocation(lat, lng) {
      document.getElementById("f-lat").value = lat.toFixed(6);
      document.getElementById("f-lng").value = lng.toFixed(6);
      if (pickerMarker) { pickerMarker.setLatLng([lat, lng]); } 
      else { pickerMarker = L.marker([lat, lng]).addTo(pickerMap); }
    }

    // Auto-Geocoding Saat Nama Kota / Provinsi Berubah
    async function autoCenterPickerMap() {
      const city = document.getElementById("f-city").value.trim();
      const province = document.getElementById("f-province").value;

      if (!city && !province) return;

      const queryLocation = `${city} ${province} Indonesia`.trim();
      try {
        const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(queryLocation)}&limit=1`);
        const results = await response.json();

        if (results && results.length > 0) {
          const lat = parseFloat(results[0].lat);
          const lon = parseFloat(results[0].lon);

          if (pickerMap && INDONESIA_BOUNDS.contains([lat, lon])) {
            pickerMap.setView([lat, lon], 12);
            setPickerLocation(lat, lon);
          }
        }
      } catch (err) {
        console.log("Geocoding error:", err);
      }
    }

    // 3. Load Data Usaha dari Firestore
    async function loadData() {
      try {
        const q = query(collection(db, "businesses"), where("status", "==", "active"));
        const snap = await getDocs(q);
        rawData = [];
        snap.forEach(d => rawData.push({ id: d.id, ...d.data() }));
        applyFilter();
      } catch (err) { console.error("Error:", err); }
    }

    function applyFilter() {
      const kw = document.getElementById("search").value.toLowerCase().trim();
      filteredData = rawData.filter(d => `${d.name} ${d.category} ${d.city} ${d.province || ''} ${d.address}`.toLowerCase().includes(kw));
      currentPage = 1;
      updateMapMarkers();
      renderList();
    }

    function updateMapMarkers() {
      mainMarkersGroup.clearLayers();
      const bounds = [];
      const basePath = getBasePath();

      filteredData.forEach(d => {
        if (d.latitude && d.longitude) {
          bounds.push([d.latitude, d.longitude]);
          const detailUrl = `${basePath}/${createSlug(d.category)}/${createSlug(d.city || 'lokasi')}/${d.slug || createSlug(d.name)}`;
          const m = L.marker([d.latitude, d.longitude]);
          m.bindPopup(`<b>${d.name}</b><br>${d.category}<br>📍 ${d.city}, ${d.province || ''}<br><a href="${detailUrl}">Detail</a>`);
          mainMarkersGroup.addLayer(m);
        }
      });

      if (bounds.length > 0) mainMap.fitBounds(bounds, { padding: [30, 30], maxZoom: 14 });
    }

    function renderList() {
      const listEl = document.getElementById("data-list");
      listEl.innerHTML = "";
      const basePath = getBasePath();

      if (filteredData.length === 0) {
        listEl.innerHTML = `<div style="grid-column:1/-1; text-align:center;">Data tidak ditemukan.</div>`;
        document.getElementById("pagination").style.display = "none";
        return;
      }

      const totalPages = Math.ceil(filteredData.length / PER_PAGE);
      const start = (currentPage - 1) * PER_PAGE;
      const pageItems = filteredData.slice(start, start + PER_PAGE);

      pageItems.forEach(d => {
        const detailUrl = `${basePath}/${createSlug(d.category)}/${createSlug(d.city || 'lokasi')}/${d.slug || createSlug(d.name)}`;
        const isOwner = currentUser && d.ownerId === currentUser.uid;

        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <span class="badge">${d.category}</span>
          <a href="${detailUrl}" class="card-title">${d.name}</a>
          <small style="color:var(--text-muted);">📍 ${d.address}, ${d.city}, ${d.province || ''}</small>
          <div style="display:flex; gap:0.4rem; margin-top:0.3rem;">
            <a href="${detailUrl}" class="btn btn-secondary" style="font-size:0.75rem; flex:1; text-align:center;">Buka Detail →</a>
            ${isOwner ? `<button class="btn btn-primary" style="font-size:0.75rem;" id="edit-b-${d.id}">Edit</button>` : ''}
          </div>
        `;
        listEl.appendChild(card);

        if (isOwner) {
          setTimeout(() => {
            document.getElementById(`edit-b-${d.id}`).onclick = () => openModalForEdit(d);
          }, 0);
        }
      });

      renderPaginationControls(totalPages);
    }

    function renderPaginationControls(totalPages) {
      const pContainer = document.getElementById("pagination");
      const numbersEl = document.getElementById("p-numbers");

      if (totalPages <= 1) { pContainer.style.display = "none"; return; }
      pContainer.style.display = "flex";
      numbersEl.innerHTML = "";

      for (let i = 1; i <= totalPages; i++) {
        const btn = document.createElement("button");
        btn.className = `page-btn ${i === currentPage ? 'active' : ''}`;
        btn.innerText = i;
        btn.onclick = () => { currentPage = i; renderList(); };
        numbersEl.appendChild(btn);
      }

      document.getElementById("p-first").disabled = currentPage === 1;
      document.getElementById("p-prev").disabled = currentPage === 1;
      document.getElementById("p-next").disabled = currentPage === totalPages;
      document.getElementById("p-last").disabled = currentPage === totalPages;

      document.getElementById("p-first").onclick = () => { currentPage = 1; renderList(); };
      document.getElementById("p-prev").onclick = () => { if (currentPage > 1) { currentPage--; renderList(); } };
      document.getElementById("p-next").onclick = () => { if (currentPage < totalPages) { currentPage++; renderList(); } };
      document.getElementById("p-last").onclick = () => { currentPage = totalPages; renderList(); };
    }

    // 4. Status Auth, Admin Check, & Proteksi Seed Dummy Single-Execution
    onAuthStateChanged(auth, async (user) => {
      currentUser = user;
      const statusText = document.getElementById("user-status-text");
      const authWrapper = document.getElementById("auth-buttons-wrapper");
      const addBtn = document.getElementById("add-data-btn");
      const seedBtn = document.getElementById("seed-btn");

      if (user) {
        statusText.innerText = `Logged in: ${user.email}`;
        const isAdmin = user.email === 'bandardeterjen@gmail.com';

        authWrapper.innerHTML = `
          ${isAdmin ? `<a href="./admin.html" class="btn btn-primary" style="margin-right:5px;">Dashboard Admin</a>` : ''}
          <button class="btn btn-danger" id="logout-btn">Logout</button>
        `;
        addBtn.style.display = "inline-block";

        // Cek Status Seed Dummy di Firestore (Hanya Admin & Belum Pernah Diseed)
        if (isAdmin) {
          const configDoc = await getDoc(doc(db, "systemConfig", "seedStatus"));
          if (!configDoc.exists() || !configDoc.data().isSeeded) {
            seedBtn.style.display = "inline-block";
          } else {
            seedBtn.style.display = "none";
          }
        } else {
          seedBtn.style.display = "none";
        }

        document.getElementById("logout-btn").onclick = () => signOut(auth);
      } else {
        statusText.innerText = `Peta & Katalog Usaha`;
        authWrapper.innerHTML = `<a href="./auth.html" class="btn btn-primary">🔑 Login / Register</a>`;
        addBtn.style.display = "none";
        seedBtn.style.display = "none";
      }
    });

    function openModalForEdit(d) {
      document.getElementById("modal-title").innerText = "Edit Usaha Milik Anda";
      document.getElementById("f-id").value = d.id;
      document.getElementById("f-name").value = d.name;
      document.getElementById("f-category").value = d.category;
      document.getElementById("f-province").value = d.province || '';
      document.getElementById("f-city").value = d.city;
      document.getElementById("f-address").value = d.address;
      document.getElementById("f-wa").value = d.whatsapp;
      document.getElementById("add-modal").classList.add("active");
      
      setTimeout(() => {
        initPickerMap();
        setPickerLocation(d.latitude, d.longitude);
        pickerMap.invalidateSize();
      }, 200);
    }

    document.getElementById("add-data-btn").onclick = () => {
      document.getElementById("modal-title").innerText = "Tambah Usaha Baru (Menunggu Approved Admin)";
      document.getElementById("add-form").reset();
      document.getElementById("f-id").value = "";
      document.getElementById("add-modal").classList.add("active");
      
      setTimeout(() => {
        initPickerMap();
        if (pickerMap) pickerMap.invalidateSize();
      }, 200);
    };

    document.getElementById("close-modal-btn").onclick = () => document.getElementById("add-modal").classList.remove("active");

    // Event Auto-Zoom Peta saat Kota / Provinsi Diisi
    document.getElementById("f-city").addEventListener("blur", autoCenterPickerMap);
    document.getElementById("f-province").addEventListener("change", autoCenterPickerMap);

    // Form Submit
    document.getElementById("add-form").onsubmit = async (e) => {
      e.preventDefault();
      const id = document.getElementById("f-id").value;
      const name = document.getElementById("f-name").value;

      const payload = {
        name,
        slug: createSlug(name),
        category: document.getElementById("f-category").value,
        province: document.getElementById("f-province").value,
        city: document.getElementById("f-city").value,
        address: document.getElementById("f-address").value,
        latitude: parseFloat(document.getElementById("f-lat").value),
        longitude: parseFloat(document.getElementById("f-lng").value),
        whatsapp: document.getElementById("f-wa").value
      };

      try {
        if (id) {
          await updateDoc(doc(db, "businesses", id), payload);
          alert("Data usaha Anda berhasil diperbarui!");
        } else {
          payload.ownerId = currentUser.uid;
          payload.status = "pending";
          payload.createdAt = serverTimestamp();
          await addDoc(collection(db, "businesses"), payload);
          alert("Usaha berhasil diajukan! Status PENDING menunggu persetujuan Admin.");
        }

        document.getElementById("add-modal").classList.remove("active");
        loadData();
      } catch (err) { alert("Error: " + err.message); }
    };

    // 5. Seed Dummy Data (Hanya Admin & Hanya 1 Kali Eksekusi)
    async function seedData() {
      if (!currentUser || currentUser.email !== 'bandardeterjen@gmail.com') {
        alert("Akses Ditolak! Hanya Admin yang dapat melakukan seed data.");
        return;
      }

      const confirmSeed = confirm("Apakah Anda yakin ingin mengisi 15 data dummy? Tindakan ini HANYA BISA DILAKUKAN SATU KALI!");
      if (!confirmSeed) return;

      const dummy = [
