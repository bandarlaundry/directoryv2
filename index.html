<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laundry Directory V2.0 — Directory & Map</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    :root {
      --primary: #0284c7;
      --bg: #f8fafc;
      --surface: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }

    header { background: var(--surface); padding: 1rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 1.2rem; color: var(--primary); }

    .btn { padding: 0.5rem 0.9rem; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.85rem; text-decoration: none; display: inline-block; }
    .btn-primary { background: var(--primary); color: white; }
    .btn-secondary { background: #e2e8f0; color: var(--text); }
    .btn-danger { background: #ef4444; color: white; }

    #map { width: 100%; height: 380px; background: #cbd5e1; z-index: 1; }

    .container { max-width: 1000px; margin: 1rem auto; padding: 0 1rem; width: 100%; }
    .controls { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
    .controls input { flex: 1; padding: 0.6rem; border: 1px solid var(--border); border-radius: 6px; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1rem; }
    .card { background: white; padding: 1rem; border-radius: 8px; border: 1px solid var(--border); display: flex; flex-direction: column; gap: 0.5rem; }
    .card-title { color: var(--primary); font-weight: 700; text-decoration: none; font-size: 1.05rem; }
    .card-title:hover { text-decoration: underline; }
    .badge { background: #e0f2fe; color: #0369a1; padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; width: fit-content; }

    .pagination { display: flex; justify-content: center; gap: 0.3rem; margin: 1.5rem 0; }
    .page-btn { padding: 0.4rem 0.8rem; border: 1px solid var(--border); background: white; border-radius: 4px; cursor: pointer; }
    .page-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
    .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Modal Form Tambah Data */
    .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 2000; align-items: center; justify-content: center; padding: 1rem; }
    .modal.active { display: flex; }
    .modal-content { background: white; border-radius: 8px; width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; padding: 1.5rem; }
    .form-group { display: flex; flex-direction: column; gap: 0.3rem; margin-bottom: 0.8rem; }
    .form-group input, .form-group select, .form-group textarea { padding: 0.6rem; border: 1px solid var(--border); border-radius: 6px; }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>Laundry Directory V2.0</h1>
      <small style="color:var(--text-muted);" id="user-status-text">Memuat status user...</small>
    </div>
    <div id="auth-buttons-wrapper">
      <a href="./auth.html" class="btn btn-primary" id="login-nav-btn">🔑 Login / Register</a>
    </div>
  </header>

  <!-- Peta Utama di Atas -->
  <div id="map"></div>

  <main class="container">
    <div class="controls">
      <input type="text" id="search" placeholder="Cari laundry, cuci sepatu, kota...">
      <button id="add-data-btn" class="btn btn-primary" style="display:none;">+ Tambah Usaha</button>
      <button id="seed-btn" class="btn btn-secondary">🌱 Isi 15 Dummy</button>
    </div>

    <!-- Container Data -->
    <div id="data-list" class="grid">
      <div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 2rem;">
        Memuat data usaha...
      </div>
    </div>

    <!-- Pagination Controls -->
    <div class="pagination" id="pagination" style="display: none;">
      <button class="page-btn" id="p-first">&lt;&lt;</button>
      <button class="page-btn" id="p-prev">&lt;</button>
      <div id="p-numbers" style="display: flex; gap: 0.3rem;"></div>
      <button class="page-btn" id="p-next">&gt;</button>
      <button class="page-btn" id="p-last">&gt;&gt;</button>
    </div>
  </main>

  <!-- Modal Form Tambah Usaha (Khusus Owner yang Login) -->
  <div class="modal" id="add-modal">
    <div class="modal-content">
      <h2 style="color:var(--primary); margin-bottom:1rem;">Tambah Usaha Baru</h2>
      <form id="add-form">
        <div class="form-group"><label>Nama Usaha</label><input type="text" id="f-name" required placeholder="Contoh: Bandar Laundry"></div>
        <div class="form-group"><label>Kategori</label>
          <select id="f-category" required>
            <option value="Laundry Kiloan">Laundry Kiloan</option>
            <option value="Laundry Satuan">Laundry Satuan</option>
            <option value="Cuci Sepatu">Cuci Sepatu</option>
            <option value="Cuci Sofa">Cuci Sofa</option>
            <option value="Home Cleaning">Home Cleaning</option>
            <option value="Car Wash">Car Wash</option>
          </select>
        </div>
        <div class="form-group"><label>Alamat Jalan</label><input type="text" id="f-address" required></div>
        <div class="form-group"><label>Kota</label><input type="text" id="f-city" required placeholder="Bogor"></div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:0.5rem;">
          <div class="form-group"><label>Latitude</label><input type="number" step="any" id="f-lat" required placeholder="-6.4025"></div>
          <div class="form-group"><label>Longitude</label><input type="number" step="any" id="f-lng" required placeholder="106.9680"></div>
        </div>
        <div class="form-group"><label>WhatsApp</label><input type="text" id="f-wa" required placeholder="085712345678"></div>
        <div style="display:flex; gap:0.5rem; margin-top:1rem;">
          <button type="submit" class="btn btn-primary" style="flex:1;">Simpan Usaha</button>
          <button type="button" class="btn btn-secondary" id="close-modal-btn">Batal</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, addDoc, query, where, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAY2JOM_GK_c8MIKOOROjG61XtC-VxF3Gc",
      authDomain: "laundry-directory-1915d.firebaseapp.com",
      projectId: "laundry-directory-1915d",
      storageBucket: "laundry-directory-1915d.appspot.com",
      messagingSenderId: "336437234560",
      appId: "1:336437234560:web:69dc7cbb36704c9f614f65"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let map, markersGroup;
    let rawData = [];
    let filteredData = [];
    let currentPage = 1;
    const PER_PAGE = 10;
    let currentUser = null;

    // Detect Base Path untuk Link URL SEO (/directoryv2)
    function getBasePath() {
      return window.location.pathname.startsWith('/directoryv2') ? '/directoryv2' : '';
    }

    function createSlug(text) {
      return text.toString().toLowerCase().trim().replace(/\s+/g, '-').replace(/[^\w\-]+/g, '');
    }

    // 1. Inisialisasi Peta
    function initMap() {
      map = L.map('map').setView([-6.4025, 106.9680], 11);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
      markersGroup = L.layerGroup().addTo(map);
      setTimeout(() => map.invalidateSize(), 300);
    }

    // 2. Load Data dari Firestore
    async function loadData() {
      try {
        const q = query(collection(db, "businesses"), where("status", "==", "active"));
        const snap = await getDocs(q);
        rawData = [];
        snap.forEach(d => rawData.push({ id: d.id, ...d.data() }));
        applyFilter();
      } catch (err) {
        console.error("Firestore Error:", err);
        document.getElementById("data-list").innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: red;">Gagal mengambil data dari Firestore.</div>`;
      }
    }

    function applyFilter() {
      const kw = document.getElementById("search").value.toLowerCase().trim();
      filteredData = rawData.filter(d => 
        `${d.name} ${d.category} ${d.city} ${d.address}`.toLowerCase().includes(kw)
      );

      currentPage = 1;
      updateMapMarkers();
      renderList();
    }

    function updateMapMarkers() {
      markersGroup.clearLayers();
      const bounds = [];
      const basePath = getBasePath();

      filteredData.forEach(d => {
        if (d.latitude && d.longitude) {
          bounds.push([d.latitude, d.longitude]);
          const detailUrl = `${basePath}/${createSlug(d.category)}/${createSlug(d.city || 'lokasi')}/${d.slug || createSlug(d.name)}`;
          
          const m = L.marker([d.latitude, d.longitude]);
          m.bindPopup(`<b>${d.name}</b><br>${d.category}<br><a href="${detailUrl}">Lihat Halaman Detail</a>`);
          markersGroup.addLayer(m);
        }
      });

      if (bounds.length > 0) map.fitBounds(bounds, { padding: [30, 30], maxZoom: 14 });
    }

    function renderList() {
      const listEl = document.getElementById("data-list");
      listEl.innerHTML = "";
      const basePath = getBasePath();

      if (filteredData.length === 0) {
        listEl.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:2rem;">Data tidak ditemukan.</div>`;
        document.getElementById("pagination").style.display = "none";
        return;
      }

      const totalPages = Math.ceil(filteredData.length / PER_PAGE);
      const start = (currentPage - 1) * PER_PAGE;
      const pageItems = filteredData.slice(start, start + PER_PAGE);

      pageItems.forEach(d => {
        const categorySlug = createSlug(d.category || 'laundry');
        const citySlug = createSlug(d.city || 'lokasi');
        const itemSlug = d.slug || createSlug(d.name);
        
        // SEO URL Permanen yang dapat diklik di Halaman Baru
        const detailUrl = `${basePath}/${categorySlug}/${citySlug}/${itemSlug}`;

        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <span class="badge">${d.category}</span>
          <a href="${detailUrl}" class="card-title">${d.name}</a>
          <small style="color:var(--text-muted);">📍 ${d.address}, ${d.city}</small>
          <a href="${detailUrl}" class="btn btn-secondary" style="font-size:0.75rem; text-align:center; margin-top:0.3rem;">Buka Halaman Detail →</a>
        `;
        listEl.appendChild(card);
      });

      renderPaginationControls(totalPages);
    }

    function renderPaginationControls(totalPages) {
      const pContainer = document.getElementById("pagination");
      const numbersEl = document.getElementById("p-numbers");

      if (totalPages <= 1) { pContainer.style.display = "none"; return; }
      pContainer.style.display = "flex";
      numbersEl.innerHTML = "";

      for (let i = 1; i <= totalPages; i++) {
        const btn = document.createElement("button");
        btn.className = `page-btn ${i === currentPage ? 'active' : ''}`;
        btn.innerText = i;
        btn.onclick = () => { currentPage = i; renderList(); };
        numbersEl.appendChild(btn);
      }

      document.getElementById("p-first").disabled = currentPage === 1;
      document.getElementById("p-prev").disabled = currentPage === 1;
      document.getElementById("p-next").disabled = currentPage === totalPages;
      document.getElementById("p-last").disabled = currentPage === totalPages;

      document.getElementById("p-first").onclick = () => { currentPage = 1; renderList(); };
      document.getElementById("p-prev").onclick = () => { if (currentPage > 1) { currentPage--; renderList(); } };
      document.getElementById("p-next").onclick = () => { if (currentPage < totalPages) { currentPage++; renderList(); } };
      document.getElementById("p-last").onclick = () => { currentPage = totalPages; renderList(); };
    }

    // 3. Status Auth & Form Modal
    onAuthStateChanged(auth, (user) => {
      currentUser = user;
      const statusText = document.getElementById("user-status-text");
      const authWrapper = document.getElementById("auth-buttons-wrapper");
      const addBtn = document.getElementById("add-data-btn");

      if (user) {
        statusText.innerText = `Logged in: ${user.email}`;
        authWrapper.innerHTML = `<button class="btn btn-danger" id="logout-btn">Logout</button>`;
        addBtn.style.display = "inline-block";

        document.getElementById("logout-btn").onclick = () => signOut(auth);
      } else {
        statusText.innerText = `Peta & Katalog Usaha`;
        authWrapper.innerHTML = `<a href="./auth.html" class="btn btn-primary">🔑 Login / Register</a>`;
        addBtn.style.display = "none";
      }
    });

    document.getElementById("add-data-btn").onclick = () => {
      document.getElementById("add-modal").classList.add("active");
    };
    document.getElementById("close-modal-btn").onclick = () => {
      document.getElementById("add-modal").classList.remove("active");
    };

    document.getElementById("add-form").onsubmit = async (e) => {
      e.preventDefault();
      const name = document.getElementById("f-name").value;
      const cat = document.getElementById("f-category").value;
      const city = document.getElementById("f-city").value;

      try {
        await addDoc(collection(db, "businesses"), {
          name,
          slug: createSlug(name),
          category: cat,
          address: document.getElementById("f-address").value,
          city,
          latitude: parseFloat(document.getElementById("f-lat").value),
          longitude: parseFloat(document.getElementById("f-lng").value),
          whatsapp: document.getElementById("f-wa").value,
          ownerId: currentUser.uid,
          status: "active",
          createdAt: serverTimestamp()
        });

        alert("Usaha baru berhasil disimpan!");
        document.getElementById("add-modal").classList.remove("active");
        document.getElementById("add-form").reset();
        loadData();
      } catch (err) { alert("Error: " + err.message); }
    };

    // 4. Seed Dummy Data
    async function seedData() {
      const dummy = [
        { name: "Bandar Laundry", category: "Laundry Kiloan", address: "Jl. Raya Cileungsi No. 12", city: "Bogor", latitude: -6.4025, longitude: 106.9680, status: "active" },
        { name: "Sneakers Clean Cibubur", category: "Cuci Sepatu", address: "Jl. Transyogi KM 3", city: "Depok", latitude: -6.3725, longitude: 106.9020, status: "active" },
        { name: "Express Clean 24h", category: "Laundry Express", address: "Jl. Pajajaran No. 45", city: "Bogor", latitude: -6.5950, longitude: 106.8050, status: "active" },
        { name: "Sofa Hygiene Solutions", category: "Cuci Sofa", address: "Jl. Margonda Raya No. 100", city: "Depok", latitude: -6.3900, longitude: 106.8300, status: "active" },
        { name: "Glow Car Wash", category: "Car Wash", address: "Jl. Kartini No. 22", city: "Bekasi", latitude: -6.2400, longitude: 106.9900, status: "active" },
        { name: "Home Clean Pro", category: "Home Cleaning", address: "Jl. Sudirman No. 88", city: "Jakarta Selatan", latitude: -6.2100, longitude: 106.8200, status: "active" },
        { name: "Kasur Steril Nusantara", category: "Cuci Kasur", address: "Jl. Boulevard Barat", city: "Jakarta Utara", latitude: -6.1500, longitude: 106.8900, status: "active" },
        { name: "Karpet Masjid Clean", category: "Cuci Karpet", address: "Jl. Pahlawan No. 15", city: "Bogor", latitude: -6.6000, longitude: 106.7900, status: "active" },
        { name: "Royal Satuan Wash", category: "Laundry Satuan", address: "Jl. Kemang Raya No. 10", city: "Jakarta Selatan", latitude: -6.2600, longitude: 106.8150, status: "active" },
        { name: "Office Shine Care", category: "Office Cleaning", address: "Jl. TB Simatupang No. 50", city: "Jakarta Selatan", latitude: -6.3000, longitude: 106.8400, status: "active" },
        { name: "Cileungsi Hygiene", category: "Cleaning Service", address: "Jl. Narogong No. 8", city: "Bogor", latitude: -6.4100, longitude: 106.9500, status: "active" },
        { name: "Kinclong Kiloan Fresh", category: "Laundry Kiloan", address: "Jl. Alternatif Cibubur", city: "Bekasi", latitude: -6.3800, longitude: 106.9200, status: "active" },
        { name: "Hydro Clean Bed", category: "Cuci Sofa", address: "Jl. Akses UI No. 12", city: "Depok", latitude: -6.3500, longitude: 106.8400, status: "active" },
        { name: "Auto Clean Steam Wash", category: "Car Wash", address: "Jl. Sholeh Iskandar No. 3", city: "Bogor", latitude: -6.5600, longitude: 106.7800, status: "active" },
        { name: "Bersih Total Facility", category: "Jasa Cleaning Lainnya", address: "Jl. Ahmad Yani No. 88", city: "Bekasi", latitude: -6.2300, longitude: 106.9800, status: "active" }
      ];

      alert("Mengunggah 15 Data Dummy ke Firestore...");
      for (const item of dummy) {
        await addDoc(collection(db, "businesses"), {
          ...item,
          slug: createSlug(item.name),
          openingHours: "08:00 - 20:00",
          whatsapp: "085712345678",
          createdAt: serverTimestamp()
        });
      }
      alert("Berhasil mengunggah data! Halaman akan direfresh.");
      loadData();
    }

    document.addEventListener("DOMContentLoaded", () => {
      initMap();
      loadData();
      document.getElementById("search").addEventListener("input", applyFilter);
      document.getElementById("seed-btn").onclick = seedData;
    });
  </script>
</body>
</html>
