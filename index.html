<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laundry Directory V2.0 — Directory & Map</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    :root {
      --header-bg: #1e3a8a; /* Royal Blue */
      --header-text: #ffffff;
      --footer-bg: #f97316; /* Orange */
      --footer-text: #000000;
      --bg: #ffffff;
      --surface: #ffffff;
      --text: #000000;
      --text-muted: #4b5563;
      --border: #e5e7eb;
      --primary: #0284c7;
      --card-bg: #ffffff;
    }

    /* DARK MODE OVERRIDE */
    body.dark-mode {
      --header-bg: #0f172a;
      --header-text: #ffffff;
      --footer-bg: #c2410c;
      --footer-text: #ffffff;
      --bg: #0f172a;
      --surface: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --primary: #38bdf8;
      --card-bg: #1e293b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; transition: background 0.3s, color 0.3s; }

    header { background: var(--header-bg); color: var(--header-text); padding: 1rem 1.5rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
    header h1 a { color: var(--header-text); text-decoration: none; font-size: 1.25rem; font-weight: 700; }

    .btn { padding: 0.5rem 0.9rem; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.85rem; text-decoration: none; display: inline-block; }
    .btn-primary { background: var(--primary); color: white; }
    .btn-secondary { background: #e2e8f0; color: #0f172a; }
    .btn-danger { background: #ef4444; color: white; }
    .btn-dark { background: rgba(255,255,255,0.2); color: white; border: 1px solid rgba(255,255,255,0.3); }

    #map { width: 100%; height: 380px; background: #cbd5e1; z-index: 1; }

    .container { max-width: 1000px; margin: 1rem auto; padding: 0 1rem; width: 100%; flex: 1; }
    .controls { display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap; }
    .controls input { flex: 1; min-width: 200px; padding: 0.6rem; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); color: var(--text); }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1rem; }
    .card { background: var(--card-bg); padding: 1rem; border-radius: 8px; border: 1px solid var(--border); display: flex; flex-direction: column; gap: 0.5rem; }
    .card-img { width: 100%; height: 160px; object-fit: cover; border-radius: 6px; }
    .card-title { color: var(--primary); font-weight: 700; text-decoration: none; font-size: 1.05rem; }
    .badge { background: #e0f2fe; color: #0369a1; padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; width: fit-content; }

    .pagination { display: flex; justify-content: center; gap: 0.3rem; margin: 1.5rem 0; }
    .page-btn { padding: 0.4rem 0.8rem; border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 4px; cursor: pointer; }
    .page-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
    .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* MODAL FORM */
    .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); z-index: 2000; align-items: center; justify-content: center; padding: 1rem; }
    .modal.active { display: flex; }
    .modal-content { background: var(--surface); color: var(--text); border-radius: 8px; width: 100%; max-width: 550px; max-height: 90vh; overflow-y: auto; padding: 1.5rem; }
    .form-group { display: flex; flex-direction: column; gap: 0.3rem; margin-bottom: 0.8rem; }
    .form-group input, .form-group select { padding: 0.6rem; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); }
    #picker-map { width: 100%; height: 200px; border-radius: 6px; border: 1px solid var(--border); margin-top: 0.3rem; }

    /* FOOTER STYLING */
    footer { background: var(--footer-bg); color: var(--footer-text); padding: 1.5rem 1rem; margin-top: auto; border-top: 1px solid var(--border); }
    .footer-container { max-width: 1000px; margin: 0 auto; display: flex; flex-direction: column; gap: 1rem; align-items: center; text-align: center; }
    .footer-links { display: flex; gap: 1.2rem; flex-wrap: wrap; justify-content: center; }
    .footer-links a { color: var(--footer-text); text-decoration: none; font-weight: 600; font-size: 0.9rem; }
    .footer-links a:hover { text-decoration: underline; }
    .copyright { font-size: 0.85rem; opacity: 0.9; }

    @media (min-width: 640px) {
      .footer-container { flex-direction: row; justify-content: space-between; text-align: left; }
    }

    .toast { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); background: #1e293b; color: white; padding: 0.8rem 1.5rem; border-radius: 999px; font-size: 0.85rem; z-index: 3000; display: none; }
  </style>
</head>
<body>

  <header>
    <div>
      <h1><a href="./">Laundry Directory V2.0</a></h1>
      <small style="opacity: 0.8;" id="user-status-text">Memuat status...</small>
    </div>
    <div style="display: flex; gap: 0.5rem; align-items: center;">
      <button class="btn btn-dark" id="dark-mode-toggle">🌙 Mode Gelap</button>
      <div id="auth-buttons-wrapper">
        <a href="./auth.html" class="btn btn-primary">🔑 Login / Register</a>
      </div>
    </div>
  </header>

  <div id="map"></div>

  <main class="container">
    <div class="controls">
      <input type="text" id="search" placeholder="Cari laundry, cuci sepatu, kota...">
      <button id="add-data-btn" class="btn btn-primary" style="display:none;">+ Tambah Usaha</button>
      <button id="seed-btn" class="btn btn-secondary" style="display:none;">🌱 Seed 15 Dummy</button>
    </div>

    <div id="data-list" class="grid">
      <div style="grid-column: 1/-1; text-align: center; padding: 2rem;">Memuat data usaha...</div>
    </div>

    <div class="pagination" id="pagination" style="display: none;">
      <button class="page-btn" id="p-first">&lt;&lt;</button>
      <button class="page-btn" id="p-prev">&lt;</button>
      <div id="p-numbers" style="display: flex; gap: 0.3rem;"></div>
      <button class="page-btn" id="p-next">&gt;</button>
      <button class="page-btn" id="p-last">&gt;&gt;</button>
    </div>
  </main>

  <!-- FOOTER -->
  <footer>
    <div class="footer-container">
      <div class="footer-links">
        <a href="#" id="link-about">Tentang Kami</a>
        <a href="#" id="link-contact">Kontak</a>
        <a href="./auth.html">Login / Registrasi</a>
      </div>
      <div class="copyright">
        &copy; <span id="current-year"></span> Laundry Directory V2.0. Hak Cipta Dilindungi.
      </div>
    </div>
  </footer>

  <!-- FORM MODAL TAMBAH/EDIT USAHA -->
  <div class="modal" id="add-modal">
    <div class="modal-content">
      <h2 style="color:var(--primary); margin-bottom:1rem;" id="modal-title">Tambah Usaha Baru</h2>
      <form id="add-form">
        <input type="hidden" id="f-id">
        <div class="form-group"><label>Nama Usaha</label><input type="text" id="f-name" required placeholder="Contoh: Bandar Laundry"></div>
        <div class="form-group"><label>Kategori</label>
          <select id="f-category" required>
            <option value="Laundry Kiloan">Laundry Kiloan</option>
            <option value="Laundry Satuan">Laundry Satuan</option>
            <option value="Cuci Sepatu">Cuci Sepatu</option>
            <option value="Cuci Sofa">Cuci Sofa</option>
            <option value="Home Cleaning">Home Cleaning</option>
            <option value="Car Wash">Car Wash</option>
          </select>
        </div>

        <div class="form-group"><label>Provinsi</label>
          <select id="f-province" required>
            <option value="">-- Pilih Provinsi --</option>
            <option value="Jawa Barat">Jawa Barat</option>
            <option value="DKI Jakarta">DKI Jakarta</option>
            <option value="Jawa Tengah">Jawa Tengah</option>
            <option value="Jawa Timur">Jawa Timur</option>
            <option value="Banten">Banten</option>
            <option value="Bali">Bali</option>
            <!-- Opsi Provinsi Lengkap -->
          </select>
        </div>

        <div class="form-group"><label>Kota / Kabupaten</label><input type="text" id="f-city" required placeholder="Ketik nama kota (misal: Bogor)"></div>
        <div class="form-group"><label>Alamat Jalan</label><input type="text" id="f-address" required placeholder="Jl. Raya No. 12"></div>

        <!-- 3 INPUT IMAGE URL (OPSIONAL) -->
        <div class="form-group">
          <label>URL Gambar/Foto Usaha (Opsional, Maksimal 3 URL)</label>
          <input type="url" id="f-img1" placeholder="URL Foto Utama / Logo (Image 1)" style="margin-bottom: 4px;">
          <input type="url" id="f-img2" placeholder="URL Foto Tempat / Layanan (Image 2)" style="margin-bottom: 4px;">
          <input type="url" id="f-img3" placeholder="URL Foto Galeri (Image 3)">
          <small style="color:var(--text-muted);">*Jika tidak diisi, gambar acak galeri bersih akan digunakan otomatis.</small>
        </div>

        <div class="form-group">
          <label>Pilih Lokasi di Peta</label>
          <div id="picker-map"></div>
        </div>

        <div style="display:grid; grid-template-columns:1fr 1fr; gap:0.5rem;">
          <div class="form-group"><label>Latitude</label><input type="number" step="any" id="f-lat" required readonly></div>
          <div class="form-group"><label>Longitude</label><input type="number" step="any" id="f-lng" required readonly></div>
        </div>

        <div class="form-group"><label>WhatsApp</label><input type="text" id="f-wa" required placeholder="085712345678"></div>

        <div style="display:flex; gap:0.5rem; margin-top:1rem;">
          <button type="submit" class="btn btn-primary" style="flex:1;">Simpan Data Usaha</button>
          <button type="button" class="btn btn-secondary" id="close-modal-btn">Batal</button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, getDoc, addDoc, doc, updateDoc, setDoc, query, where, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAY2JOM_GK_c8MIKOOROjG61XtC-VxF3Gc",
      authDomain: "laundry-directory-1915d.firebaseapp.com",
      projectId: "laundry-directory-1915d",
      storageBucket: "laundry-directory-1915d.appspot.com",
      messagingSenderId: "336437234560",
      appId: "1:336437234560:web:69dc7cbb36704c9f614f65"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let mainMap, mainMarkersGroup, pickerMap, pickerMarker;
    let rawData = [];
    let filteredData = [];
    let currentPage = 1;
    const PER_PAGE = 10;
    let currentUser = null;

    // GALERI GAMBAR RANDOM HIGIENS/LAUNDRY
    const RANDOM_IMAGES = [
      "https://images.unsplash.com/photo-1545173168-9f1947eebb7f?w=600&auto=format&fit=crop&q=80",
      "https://images.unsplash.com/photo-1517677208171-0bc6725a3e60?w=600&auto=format&fit=crop&q=80",
      "https://images.unsplash.com/photo-1582735689369-4fe89db7114c?w=600&auto=format&fit=crop&q=80",
      "https://images.unsplash.com/photo-1604335399105-a0c585fd81a1?w=600&auto=format&fit=crop&q=80",
      "https://images.unsplash.com/photo-1521656693074-0ef32e80a5d5?w=600&auto=format&fit=crop&q=80"
    ];

    const INDONESIA_BOUNDS = L.latLngBounds(L.latLng(-11.1, 95.0), L.latLng(6.2, 141.0));

    function getBasePath() { return window.location.pathname.startsWith('/directoryv2') ? '/directoryv2' : ''; }
    function createSlug(text) { return text.toString().toLowerCase().trim().replace(/\s+/g, '-').replace(/[^\w\-]+/g, ''); }

    // Auto Copyright Year
    document.getElementById("current-year").innerText = new Date().getFullYear();

    // Dark Mode Handler
    const darkToggle = document.getElementById("dark-mode-toggle");
    if (localStorage.getItem("theme") === "dark") {
      document.body.classList.add("dark-mode");
      darkToggle.innerText = "☀️ Mode Terang";
    }

    darkToggle.onclick = () => {
      document.body.classList.toggle("dark-mode");
      const isDark = document.body.classList.contains("dark-mode");
      localStorage.setItem("theme", isDark ? "dark" : "light");
      darkToggle.innerText = isDark ? "☀️ Mode Terang" : "🌙 Mode Gelap";
    };

    // Dialog Modal Info Footer
    document.getElementById("link-about").onclick = (e) => { e.preventDefault(); alert("Laundry Directory V2.0 adalah platform katalog usaha laundry & jasa kebersihan berbasis peta di seluruh Indonesia."); };
    document.getElementById("link-contact").onclick = (e) => { e.preventDefault(); alert("Kontak Admin: bandardeterjen@gmail.com | WhatsApp: 085712345678"); };

    function initMainMap() {
      mainMap = L.map('map', { maxBounds: INDONESIA_BOUNDS, maxBoundsViscosity: 1.0, minZoom: 5 }).setView([-2.5489, 118.0149], 5);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(mainMap);
      mainMarkersGroup = L.layerGroup().addTo(mainMap);
      setTimeout(() => mainMap.invalidateSize(), 300);
    }

    function initPickerMap() {
      if (pickerMap) return;
      pickerMap = L.map('picker-map', { maxBounds: INDONESIA_BOUNDS, maxBoundsViscosity: 1.0, minZoom: 5 }).setView([-6.4025, 106.9680], 12);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(pickerMap);
      pickerMap.on('click', (e) => {
        if (INDONESIA_BOUNDS.contains(e.latlng)) { setPickerLocation(e.latlng.lat, e.latlng.lng); }
        else { alert("Penandaan lokasi hanya di wilayah Indonesia!"); }
      });
    }

    function setPickerLocation(lat, lng) {
      document.getElementById("f-lat").value = lat.toFixed(6);
      document.getElementById("f-lng").value = lng.toFixed(6);
      if (pickerMarker) { pickerMarker.setLatLng([lat, lng]); }
      else { pickerMarker = L.marker([lat, lng]).addTo(pickerMap); }
    }

    async function loadData() {
      try {
        const q = query(collection(db, "businesses"), where("status", "==", "active"));
        const snap = await getDocs(q);
        rawData = [];
        snap.forEach(d => rawData.push({ id: d.id, ...d.data() }));
        applyFilter();
      } catch (err) { console.error("Error:", err); }
    }

    function applyFilter() {
      const kw = document.getElementById("search").value.toLowerCase().trim();
      filteredData = rawData.filter(d => `${d.name} ${d.category} ${d.city} ${d.province || ''} ${d.address}`.toLowerCase().includes(kw));
      currentPage = 1;
      updateMapMarkers();
      renderList();
    }

    function updateMapMarkers() {
      mainMarkersGroup.clearLayers();
      const bounds = [];
      const basePath = getBasePath();

      filteredData.forEach(d => {
        if (d.latitude && d.longitude) {
          bounds.push([d.latitude, d.longitude]);
          const detailUrl = `${basePath}/${createSlug(d.category)}/${createSlug(d.city || 'lokasi')}/${d.slug || createSlug(d.name)}`;
          const m = L.marker([d.latitude, d.longitude]);
          m.bindPopup(`<b>${d.name}</b><br>${d.category}<br>📍 ${d.city}<br><a href="${detailUrl}">Detail</a>`);
          mainMarkersGroup.addLayer(m);
        }
      });

      if (bounds.length > 0) mainMap.fitBounds(bounds, { padding: [30, 30], maxZoom: 14 });
    }

    function renderList() {
      const listEl = document.getElementById("data-list");
      listEl.innerHTML = "";
      const basePath = getBasePath();

      if (filteredData.length === 0) {
        listEl.innerHTML = `<div style="grid-column:1/-1; text-align:center;">Data tidak ditemukan.</div>`;
        document.getElementById("pagination").style.display = "none";
        return;
      }

      const totalPages = Math.ceil(filteredData.length / PER_PAGE);
      const start = (currentPage - 1) * PER_PAGE;
      const pageItems = filteredData.slice(start, start + PER_PAGE);

      pageItems.forEach(d => {
        const detailUrl = `${basePath}/${createSlug(d.category)}/${createSlug(d.city || 'lokasi')}/${d.slug || createSlug(d.name)}`;
        const isOwner = currentUser && d.ownerId === currentUser.uid;

        // Gunakan Gambar Pertama atau Random
        const displayThumb = (d.images && d.images.length > 0 && d.images[0]) ? d.images[0] : (d.imageUrl || RANDOM_IMAGES[Math.floor(Math.random() * RANDOM_IMAGES.length)]);

        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <img src="${displayThumb}" class="card-img" alt="${d.name}">
          <span class="badge">${d.category}</span>
          <a href="${detailUrl}" class="card-title">${d.name}</a>
          <small style="color:var(--text-muted);">📍 ${d.address}, ${d.city}</small>
          <div style="display:flex; gap:0.4rem; margin-top:0.3rem;">
            <a href="${detailUrl}" class="btn btn-secondary" style="font-size:0.75rem; flex:1; text-align:center;">Buka Detail →</a>
            ${isOwner ? `<button class="btn btn-primary" style="font-size:0.75rem;" id="edit-b-${d.id}">Edit</button>` : ''}
          </div>
        `;
        listEl.appendChild(card);

        if (isOwner) {
          setTimeout(() => { document.getElementById(`edit-b-${d.id}`).onclick = () => openModalForEdit(d); }, 0);
        }
      });

      renderPaginationControls(totalPages);
    }

    function renderPaginationControls(totalPages) {
      const pContainer = document.getElementById("pagination");
      const numbersEl = document.getElementById("p-numbers");

      if (totalPages <= 1) { pContainer.style.display = "none"; return; }
      pContainer.style.display = "flex";
      numbersEl.innerHTML = "";

      for (let i = 1; i <= totalPages; i++) {
        const btn = document.createElement("button");
        btn.className = `page-btn ${i === currentPage ? 'active' : ''}`;
        btn.innerText = i;
        btn.onclick = () => { currentPage = i; renderList(); };
        numbersEl.appendChild(btn);
      }

      document.getElementById("p-first").disabled = currentPage === 1;
      document.getElementById("p-prev").disabled = currentPage === 1;
      document.getElementById("p-next").disabled = currentPage === totalPages;
      document.getElementById("p-last").disabled = currentPage === totalPages;

      document.getElementById("p-first").onclick = () => { currentPage = 1; renderList(); };
      document.getElementById("p-prev").onclick = () => { if (currentPage > 1) { currentPage--; renderList(); } };
      document.getElementById("p-next").onclick = () => { if (currentPage < totalPages) { currentPage++; renderList(); } };
      document.getElementById("p-last").onclick = () => { currentPage = totalPages; renderList(); };
    }

    onAuthStateChanged(auth, async (user) => {
      currentUser = user;
      const statusText = document.getElementById("user-status-text");
      const authWrapper = document.getElementById("auth-buttons-wrapper");
      const addBtn = document.getElementById("add-data-btn");

      if (user) {
        statusText.innerText = `Logged in: ${user.email}`;
        const isAdmin = user.email === 'bandardeterjen@gmail.com';

        authWrapper.innerHTML = `
          ${isAdmin ? `<a href="./admin.html" class="btn btn-primary" style="margin-right:5px;">Dashboard Admin</a>` : ''}
          <button class="btn btn-danger" id="logout-btn">Logout</button>
        `;
        addBtn.style.display = "inline-block";

        document.getElementById("logout-btn").onclick = () => signOut(auth);
      } else {
        statusText.innerText = `Peta & Katalog Usaha`;
        authWrapper.innerHTML = `<a href="./auth.html" class="btn btn-primary">🔑 Login / Register</a>`;
        addBtn.style.display = "none";
      }
    });

    function openModalForEdit(d) {
      document.getElementById("modal-title").innerText = "Edit Usaha Milik Anda";
      document.getElementById("f-id").value = d.id;
      document.getElementById("f-name").value = d.name;
      document.getElementById("f-category").value = d.category;
      document.getElementById("f-province").value = d.province || '';
      document.getElementById("f-city").value = d.city;
      document.getElementById("f-address").value = d.address;
      document.getElementById("f-wa").value = d.whatsapp;

      // Fill 3 Images
      document.getElementById("f-img1").value = (d.images && d.images[0]) ? d.images[0] : (d.imageUrl || '');
      document.getElementById("f-img2").value = (d.images && d.images[1]) ? d.images[1] : '';
      document.getElementById("f-img3").value = (d.images && d.images[2]) ? d.images[2] : '';

      document.getElementById("add-modal").classList.add("active");
      setTimeout(() => { initPickerMap(); setPickerLocation(d.latitude, d.longitude); pickerMap.invalidateSize(); }, 200);
    }

    document.getElementById("add-data-btn").onclick = () => {
      document.getElementById("modal-title").innerText = "Tambah Usaha Baru (Menunggu Approved Admin)";
      document.getElementById("add-form").reset();
      document.getElementById("f-id").value = "";
      document.getElementById("add-modal").classList.add("active");
      setTimeout(() => { initPickerMap(); if (pickerMap) pickerMap.invalidateSize(); }, 200);
    };

    document.getElementById("close-modal-btn").onclick = () => document.getElementById("add-modal").classList.remove("active");

    // Form Submit
    document.getElementById("add-form").onsubmit = async (e) => {
      e.preventDefault();
      const id = document.getElementById("f-id").value;
      const name = document.getElementById("f-name").value;

      // Ambil 3 Image URL Opsional
      const img1 = document.getElementById("f-img1").value.trim();
      const img2 = document.getElementById("f-img2").value.trim();
      const img3 = document.getElementById("f-img3").value.trim();

      const userImages = [img1, img2, img3].filter(Boolean);

      // Jika kosong, berikan image random
      if (userImages.length === 0) {
        userImages.push(RANDOM_IMAGES[Math.floor(Math.random() * RANDOM_IMAGES.length)]);
      }

      const payload = {
        name,
        slug: createSlug(name),
        category: document.getElementById("f-category").value,
        province: document.getElementById("f-province").value,
        city: document.getElementById("f-city").value,
        address: document.getElementById("f-address").value,
        images: userImages,
        imageUrl: userImages[0], // Main Thumbnail Meta SEO
        latitude: parseFloat(document.getElementById("f-lat").value),
        longitude: parseFloat(document.getElementById("f-lng").value),
        whatsapp: document.getElementById("f-wa").value
      };

      try {
        if (id) {
          await updateDoc(doc(db, "businesses", id), payload);
          alert("Data usaha berhasil diperbarui!");
        } else {
          payload.ownerId = currentUser.uid;
          payload.status = "pending";
          payload.createdAt = serverTimestamp();
          await addDoc(collection(db, "businesses"), payload);
          alert("Usaha berhasil diajukan! Status PENDING menunggu persetujuan Admin.");
        }

        document.getElementById("add-modal").classList.remove("active");
        loadData();
      } catch (err) { alert("Error: " + err.message); }
    };

    document.addEventListener("DOMContentLoaded", () => {
      initMainMap();
      loadData();
      document.getElementById("search").addEventListener("input", applyFilter);
    });
  </script>
</body>
</html>
